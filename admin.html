<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel de Estudos · Administração</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Mono:wght@400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/app.html">Painel de Estudos</a>
    <div class="row" style="align-items:center"><a class="btn ghost" href="/app.html">Meu painel</a><button class="btn ghost" id="sair">Sair</button></div>
  </header>
  <div class="hero"><h1>Painel do<span class="script">administrador</span></h1></div>
  <main id="view"><p class="muted">Carregando…</p></main>
  <div id="cat"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/comum.js"></script>
<script src="/assets/rodape.js"></script>
<script>
(async () => {
  const { sb, esc, toast, win } = App;
  const V = document.getElementById("view");
  document.getElementById("sair").onclick = App.sair;
  if (!(await App.sessao())) { location.replace("/"); return; }
  const eu = await App.meuPerfil().catch(() => null);
  if (!eu?.is_admin) { V.innerHTML = `<div class="msg bad">Esta página é só do administrador.</div>`; return; }
  // termos de uso: a versão atual (09_termos.sql). O admin também aceita antes (a tela de aceite fica no painel).
  const tv = await sb.rpc("termos_versao_atual");
  const termosAtual = tv.error ? null : tv.data;
  if (termosAtual && !(eu.termos_versao >= termosAtual)) { location.replace("/app.html"); return; }

  let alunos = [], facs = [], uso = {}, filtro = "";
  const mes = App.isoHoje().slice(0, 8) + "01";
  // uso de IA no mês e limite de cada aluno (o limite só existe depois do 06_estudo.sql; antes disso só o de resumos)
  const IA = [["resumos", "limite_resumos_mes", "resumos"], ["questoes", "limite_questoes_mes", "questões"], ["mapas", "limite_mapas_mes", "mapas"]];
  const somaDias = (iso, n) => { const d = iso && iso >= App.isoHoje() ? new Date(iso + "T12:00") : new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  function status(a) {
    if (!a.ativo) return ["Bloqueado", "s-bad"];
    if (a.vence_em && a.vence_em < App.isoHoje()) return ["Vencido", "s-bad"];
    if (a.vence_em) { const n = Math.round((new Date(a.vence_em + "T00:00") - App.hoje()) / 864e5); if (n <= 5) return [`Vence em ${n}d`, "s-warn"]; }
    return ["Em dia", "s-ok"];
  }
  // coluna "Termos": ✓ e a data do aceite da versão atual, ou "pendente"
  function termosCel(a) {
    if (!termosAtual) return `<span class="muted">sem dados</span>`;
    if (a.termos_versao >= termosAtual && a.termos_aceitos_em) { const d = new Date(a.termos_aceitos_em);
      return `<span class="chip s-ok" title="Versão ${esc(a.termos_versao)} aceita em ${esc(d.toLocaleString("pt-BR"))}">✓ ${esc(d.toLocaleDateString("pt-BR"))}</span>`; }
    return `<span class="chip s-warn"${a.termos_versao ? ` title="Aceitou a versão ${esc(a.termos_versao)}; falta a ${esc(termosAtual)}"` : ""}>pendente</span>`;
  }
  async function carregar() {
    const [a, f, u] = await Promise.all([
      sb.from("perfis").select("*").order("criado_em", { ascending: false }),
      sb.from("faculdades").select("id,nome"),
      sb.from("uso_ia").select("*").eq("mes", mes),
    ]);
    if (a.error) { V.innerHTML = `<div class="msg bad">${esc(a.error.message)}</div>`; return; }
    alunos = a.data; facs = f.data || []; uso = Object.fromEntries((u.data || []).map((x) => [x.aluno_id, x]));
    draw(); if (!CAT.iniciado) { CAT.iniciado = true; catTela(); }
  }
  function draw(msg) {
    const fac = (id) => facs.find((f) => f.id === id)?.nome || "Não informada";
    const lista = alunos.filter((a) => !filtro || (a.nome || "").toLowerCase().includes(filtro) || a.email.includes(filtro));
    const emDia = alunos.filter((a) => status(a)[1] === "s-ok" && !a.is_admin).length;
    const rows = lista.map((a) => { const s = status(a), u = uso[a.id];
      return `<tr data-id="${a.id}">
        <td><b>${esc(a.nome || "Sem nome")}</b>${a.is_admin ? ` <span class="chip s-warn">admin</span>` : ""}<div class="muted" style="font-size:12.5px">${esc(a.email)}</div></td>
        <td style="font-size:13px">${esc(fac(a.faculdade_id))}${a.semestre ? ` · ${a.semestre}º${a.turma ? " " + esc(a.turma) : ""}` : ""}${a.onboarding_ok ? "" : `<div class="muted">não configurou</div>`}</td>
        <td><select data-k="plano"><option ${a.plano === "mensal" ? "selected" : ""}>mensal</option><option ${a.plano === "semestral" ? "selected" : ""}>semestral</option><option ${a.plano === "teste" ? "selected" : ""}>teste</option></select></td>
        <td><input type="date" data-k="vence_em" value="${esc(a.vence_em || "")}"><div class="row" style="gap:4px;margin-top:4px"><button class="btn ghost" style="padding:2px 6px;font-size:12px" data-a="mais" data-n="30">+30d</button><button class="btn ghost" style="padding:2px 6px;font-size:12px" data-a="mais" data-n="180">+6m</button></div></td>
        <td><span class="chip ${s[1]}">${s[0]}</span></td>
        <td style="font-size:12.5px;white-space:nowrap">${termosCel(a)}</td>
        <td class="tnum" style="font-size:13px"><div class="ia-uso">${IA.map(([k, lim, nome]) => `<label title="Limite de ${nome} por mês"><span>${u?.[k] || 0} /</span><input type="number" min="0" max="100000" step="1" data-k="${lim}" value="${esc(a[lim] ?? "")}" aria-label="Limite de ${nome} por mês de ${esc(a.nome || a.email)}"> <span class="muted">${nome}</span></label>`).join("")}</div></td>
        <td><div class="row" style="gap:6px"><button class="btn" data-a="salvar">Salvar</button><button class="btn ghost" data-a="ativo">${a.ativo ? "Bloquear" : "Liberar"}</button></div></td></tr>`; }).join("");
    V.innerHTML = win("Novo aluno", `<form id="novo" class="row">
        <label class="field" style="flex:1 1 180px"><span class="mono">Nome</span><input name="nome" required></label>
        <label class="field" style="flex:1 1 220px"><span class="mono">E-mail</span><input name="email" type="email" required></label>
        <label class="field" style="flex:0 1 130px"><span class="mono">Plano</span><select name="plano"><option>mensal</option><option>semestral</option><option>teste</option></select></label>
        <label class="field" style="flex:0 1 160px"><span class="mono">Vence em</span><input name="vence_em" type="date" value="${somaDias(null, 30)}"></label>
        <label class="field" style="flex:1 1 200px"><span class="mono">Senha inicial</span><span class="row" style="gap:6px;flex-wrap:nowrap"><input name="senha" id="senhaNova" minlength="8" autocomplete="new-password" placeholder="Vazio = convite por e-mail"><button type="button" class="btn" data-a="gerar">Gerar</button></span></label>
        <button class="btn solid">Criar aluno</button></form>
        <p class="muted" style="font-size:13px;margin:10px 0 0">Com senha: a conta já fica pronta e você passa o e-mail e a senha para o aluno (ele pode trocar depois). Sem senha: ele recebe um convite por e-mail. Na primeira entrada, ele monta o painel.</p>${msg ? `<div class="msg ${msg.bad ? "bad" : ""}">${esc(msg.t)}</div>` : ""}`)
      + win(`Alunos · ${emDia} em dia de ${alunos.filter((a) => !a.is_admin).length}`, `<div class="row" style="margin-bottom:10px"><input class="inp" id="busca" placeholder="Buscar por nome ou e-mail" value="${esc(filtro)}" style="max-width:320px"></div>
        <div class="tablewrap"><table><thead><tr><th>Aluno</th><th>Faculdade</th><th>Plano</th><th>Vencimento</th><th>Situação</th><th>Termos</th><th>IA no mês (usado / limite)</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="8" class="muted">Nenhum aluno.</td></tr>`}</tbody></table></div>`);
  }
  async function salvarLinha(tr, extra) {
    const id = tr.dataset.id;
    const upd = { plano: tr.querySelector('[data-k="plano"]').value, vence_em: tr.querySelector('[data-k="vence_em"]').value || null, ...extra };
    const aluno = alunos.find((a) => a.id === id);
    for (const [, lim] of IA) {
      const inp = tr.querySelector(`[data-k="${lim}"]`); if (!inp || !(lim in aluno)) continue;
      const v = parseInt(inp.value, 10);
      if (!Number.isInteger(v) || v < 0 || v > 100000) return toast("Limite inválido: use um número de 0 a 100000.");
      if (v !== aluno[lim]) upd[lim] = v;
    }
    const { error } = await sb.from("perfis").update(upd).eq("id", id);
    if (error) return toast("Erro: " + error.message);
    Object.assign(alunos.find((a) => a.id === id), upd); draw(); toast("Salvo");
  }
  V.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-a]"); if (!b) return;
    if (b.dataset.a === "gerar") { const ch = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const r = crypto.getRandomValues(new Uint32Array(10)); document.getElementById("senhaNova").value = Array.from(r, (x) => ch[x % ch.length]).join(""); return; }
    const tr = b.closest("tr"); if (!tr) return;
    const a = alunos.find((x) => x.id === tr.dataset.id);
    if (b.dataset.a === "salvar") salvarLinha(tr);
    if (b.dataset.a === "ativo") { if (a.id === eu.id && a.ativo) return toast("Você não pode bloquear a si mesmo."); salvarLinha(tr, { ativo: !a.ativo }); }
    if (b.dataset.a === "mais") { const inp = tr.querySelector('[data-k="vence_em"]'); inp.value = somaDias(inp.value, +b.dataset.n); }
  });
  V.addEventListener("input", (e) => { if (e.target.id === "busca") { filtro = e.target.value.trim().toLowerCase(); const pos = e.target.selectionStart; draw(); const i = document.getElementById("busca"); i.focus(); i.setSelectionRange(pos, pos); } });
  V.addEventListener("submit", async (e) => {
    if (e.target.id !== "novo") return; e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target)); if (!fd.senha) delete fd.senha; const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Criando…";
    const { data, error } = await sb.functions.invoke("admin-criar-aluno", { body: { ...fd, redirectTo: location.origin + "/app.html" } });
    let erro = data?.erro; if (!erro && error) { try { erro = (await error.context.json()).erro } catch (_) { erro = error.message } }
    if (erro) return draw({ t: erro, bad: true });
    await carregar(); draw({ t: data?.convite ? `Convite enviado para ${fd.email}.` : `Conta criada. Passe para o aluno: e-mail ${fd.email} e senha ${fd.senha}` });
  });
  /* ---------- Matérias por semestre (catálogo usado na configuração do aluno) ---------- */
  const CAT = { iniciado: false, fac: null, sem: 1, msg: null };
  async function catTela() {
    const box = document.getElementById("cat");
    if (!CAT.fac) CAT.fac = (facs.find((f) => f.nome === "Universidad Interamericana") || facs[0])?.id;
    const { data, error } = CAT.fac ? await sb.from("catalogo_materias").select("id,nome,ordem").eq("faculdade_id", CAT.fac).eq("semestre", CAT.sem).order("ordem").order("nome") : { data: [] };
    const lista = data || [];
    box.innerHTML = win("Matérias por semestre", `<p class="muted" style="margin:0 0 12px;font-size:13.5px">Quando o aluno escolhe o semestre na configuração, o painel já coloca estas matérias. Ele pode mudar, tirar ou adicionar outras. Mudar aqui não altera quem já configurou.</p>
      <div class="row" style="margin-bottom:12px"><label class="field" style="flex:1 1 220px"><span class="mono">Faculdade</span><select id="catFac">${facs.map((f) => `<option value="${f.id}" ${f.id == CAT.fac ? "selected" : ""}>${esc(f.nome)}</option>`).join("")}</select></label>
        <label class="field" style="flex:0 1 140px"><span class="mono">Semestre</span><select id="catSem">${Array.from({ length: 10 }, (_, i) => `<option value="${i + 1}" ${CAT.sem == i + 1 ? "selected" : ""}>${i + 1}º</option>`).join("")}</select></label></div>
      ${error ? `<div class="msg bad">${/catalogo|schema cache|relation/i.test(error.message) ? "Falta rodar o 04_semestres.sql no Supabase." : esc(error.message)}</div>`
        : lista.length ? `<ul class="cat-lista">${lista.map((m) => `<li data-id="${m.id}"><input class="inp" value="${esc(m.nome)}" maxlength="120" aria-label="Nome da matéria"><button class="btn" data-c="renomear">Salvar</button><button class="btn ghost" data-c="tirar">Remover</button></li>`).join("")}</ul>`
        : `<div class="empty">Nenhuma matéria neste semestre. Os alunos vão digitar as deles.</div>`}
      <form id="catNovo" class="row" style="margin-top:12px"><label class="field" style="flex:1 1 220px"><span class="mono">Nova matéria</span><input name="nome" maxlength="120" required placeholder="Ex.: Pediatría"></label><button class="btn solid">Adicionar</button></form>
      ${CAT.msg ? `<div class="msg ${CAT.msg.bad ? "bad" : ""}">${esc(CAT.msg.t)}</div>` : ""}`);
    CAT.msg = null;
    box.querySelector("#catFac").onchange = (e) => { CAT.fac = +e.target.value; catTela(); };
    box.querySelector("#catSem").onchange = (e) => { CAT.sem = +e.target.value; catTela(); };
    box.querySelector("#catNovo").onsubmit = async (e) => {
      e.preventDefault(); const nome = e.target.nome.value.trim(); if (!nome) return;
      const ordem = lista.reduce((m, x) => Math.max(m, x.ordem), -1) + 1;
      const { error } = await sb.from("catalogo_materias").insert({ faculdade_id: CAT.fac, semestre: CAT.sem, nome, ordem });
      CAT.msg = error ? { bad: true, t: /duplicate|unique/i.test(error.message) ? "Essa matéria já está na lista." : "Erro: " + error.message } : null;
      if (!error) toast("Matéria adicionada"); catTela();
    };
    box.querySelector(".win-body").onclick = async (e) => {
      const b = e.target.closest("[data-c]"); if (!b) return;
      const li = b.closest("li"), id = li.dataset.id;
      if (b.dataset.c === "renomear") {
        const nome = li.querySelector("input").value.trim(); if (!nome) return toast("Escreva o nome.");
        const { error } = await sb.from("catalogo_materias").update({ nome }).eq("id", id);
        if (error) return toast(/duplicate|unique/i.test(error.message) ? "Essa matéria já está na lista." : "Erro: " + error.message);
        toast("Salvo");
      }
      if (b.dataset.c === "tirar") {
        if (!confirm(`Remover "${li.querySelector("input").value}" da lista do ${CAT.sem}º semestre?`)) return;
        const { error } = await sb.from("catalogo_materias").delete().eq("id", id);
        if (error) return toast("Erro: " + error.message);
        toast("Removida"); catTela();
      }
    };
  }
  carregar();
})();
</script>
</body>
</html>
