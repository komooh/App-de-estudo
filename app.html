<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel de Estudos</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Mono:wght@400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/app.html">Painel de Estudos</a>
    <div class="row" style="align-items:center"><button class="eu" id="eu" hidden aria-label="Meu perfil"><span class="av" id="euAv"></span><span id="euNome"></span></button><a id="lnkAdmin" class="btn ghost" href="/admin.html" hidden>Administração</a><button class="btn ghost" id="sair">Sair</button></div>
  </header>
  <main id="view"><p class="muted">Carregando…</p></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/comum.js"></script>
<script src="/assets/rodape.js"></script>
<script>
(async () => {
  const { sb, esc, toast, win } = App;
  const V = document.getElementById("view");
  // link de "esqueci a senha": o Supabase manda type=recovery na URL (lido antes de ele limpar a URL)
  if (/type=recovery/.test(location.hash)) sessionStorage.setItem("recuperando", "1");
  document.getElementById("sair").onclick = App.sair;

  // Espera o Supabase ler o link mágico da URL (se veio do e-mail)
  const s = await App.sessao();
  if (!s) { location.replace("/"); return; }
  // volta da tela do Google ("Entrar com o Google"): #drive=conectado | negado | expirou | erro
  const driveVolta = (location.hash.match(/drive=([a-z_]+)/) || [])[1] || "";
  if (driveVolta) history.replaceState(null, "", location.pathname);
  const DRV = { aba: null, ocupado: false, msg: null, volta: driveVolta };
  const DRV_STATUS = { ok: ["s-ok", "em dia"], varrendo: ["s-warn", "lendo"], pendente: ["s-warn", "falta ler"], erro: ["s-bad", "erro"], reconectar: ["s-bad", "reconectar"] };
  const MAT_STATUS = { ok: ["s-ok", "lido"], pendente: ["s-ok", "pronto"], sem_texto: ["s-warn", "sem texto"], grande_demais: ["s-warn", "grande demais"], erro: ["s-bad", "erro"] };
  const VOLTA_MSG = { conectado: "Google conectado. Agora cole o link da pasta.", negado: "Você não deu a permissão no Google.",
    expirou: "O pedido expirou. Tente conectar de novo.", sem_permissao: "Marque a permissão de ver os arquivos do Drive e tente de novo.", erro: "Não consegui conectar com o Google. Tente de novo." };
  let P;
  try { P = await App.meuPerfil(); } catch (e) { V.innerHTML = `<div class="msg bad">Não consegui carregar seu perfil: ${esc(e.message)}</div>`; return; }
  pintarEu();
  document.getElementById("eu").onclick = () => perfilTela();
  if (P.is_admin) document.getElementById("lnkAdmin").hidden = false;
  // veio do e-mail de "esqueci a senha": pede a senha nova antes de tudo
  if (sessionStorage.getItem("recuperando") === "1") return perfilTela(true);

  if (!App.acessoOk(P)) {
    const venceu = P.ativo && P.vence_em;
    V.innerHTML = `<div class="hero"><h1>Acesso<span class="script">${venceu ? "vencido" : "pendente"}</span></h1></div>` + win("Seu acesso",
      `<p style="margin:0">${venceu ? `Sua assinatura venceu em <b>${new Date(P.vence_em + "T12:00").toLocaleDateString("pt-BR")}</b>. Fale com o administrador para renovar; seus dados continuam guardados.` : "Sua conta ainda não foi liberada. Fale com o administrador da sua turma."}</p>`);
    if (!P.is_admin) return;
  }
  if (!P.onboarding_ok) return onboarding();
  return home();

  /* ================= CONFIGURAÇÃO GUIADA (primeira entrada) ================= */
  async function onboarding() {
    const { data: facs } = await sb.from("faculdades").select("*").eq("ativa", true).order("nome");
    const st = { passo: 1, nome: P.nome || "", faculdade_id: P.faculdade_id || facs?.[0]?.id || null, semestre: P.semestre || "", turma: P.turma || "",
      disc: [{ nome: "", professor: "", tem_pratica: false }], provas: {} };
    const PASSOS = ["Você", "Matérias", "Provas", "Notas"];
    const fac = () => (facs || []).find((f) => f.id == st.faculdade_id);
    const kinds = (d) => [["P1", "teorica"], ["P2", "teorica"], ["Final", "teorica"], ...(d.tem_pratica ? [["P1", "pratica"], ["P2", "pratica"], ["Final", "pratica"]] : [])];
    const kKey = (i, t, m) => `${i}|${t}|${m}`;
    const lbl = (t, m) => `${t} ${m === "pratica" ? "prática" : "teórica"}`;
    function draw(err) {
      let body = "";
      if (st.passo === 1) body = `
        <label class="field"><span class="mono">Seu nome</span><input id="nome" value="${esc(st.nome)}" required></label>
        <label class="field"><span class="mono">Faculdade</span><select id="fac">${(facs || []).map((f) => `<option value="${f.id}" ${f.id == st.faculdade_id ? "selected" : ""}>${esc(f.nome)}</option>`).join("")}</select></label>
        <div class="row"><label class="field" style="flex:1"><span class="mono">Semestre</span><select id="sem"><option value="">Escolha</option>${Array.from({ length: 12 }, (_, i) => `<option ${st.semestre == i + 1 ? "selected" : ""}>${i + 1}</option>`).join("")}</select></label>
        <label class="field" style="flex:1"><span class="mono">Turma (opcional)</span><input id="turma" value="${esc(st.turma)}" placeholder="Ex.: F"></label></div>`;
      if (st.passo === 2) body = `<p class="muted" style="margin:0">Coloque as matérias deste semestre e marque "tem prática" nas que têm prova prática separada. Se preferir, continue e adicione depois.</p>
        ${st.disc.map((d, i) => `<div class="discrow">
          <label class="field"><span class="mono">Matéria</span><input data-d="${i}" data-k="nome" value="${esc(d.nome)}" placeholder="Ex.: Farmacologia 2"></label>
          <label class="field"><span class="mono">Professor</span><input data-d="${i}" data-k="professor" value="${esc(d.professor)}" placeholder="Opcional"></label>
          <label class="check"><input type="checkbox" data-d="${i}" data-k="tem_pratica" ${d.tem_pratica ? "checked" : ""}>tem prática</label>
          <button class="btn ghost" data-a="rmDisc" data-i="${i}" aria-label="Remover matéria" ${st.disc.length < 2 ? "disabled" : ""}>Remover</button></div>`).join("")}
        <button class="btn" data-a="addDisc" style="align-self:flex-start">+ Adicionar matéria</button>`;
      if (st.passo === 3) body = `<p class="muted" style="margin:0">Preencha as datas que você já sabe. As que ainda não saíram podem ficar em branco: é só colocar depois. A agenda monta o plano de estudo com as datas que existirem.</p>
        ${discValidas().length ? "" : `<div class="empty">Você não colocou matérias no passo anterior. Pode continuar e adicionar depois.</div>`}
        ${st.disc.map((d, i) => !d.nome ? "" : `<div class="card"><h3>${esc(d.nome)}</h3><div class="provgrid">${kinds(d).map(([t, m]) => { const v = st.provas[kKey(i, t, m)] || {};
          return `<span class="lbl">${lbl(t, m)}</span><input class="inp" type="date" data-p="${kKey(i, t, m)}" data-k="data" value="${esc(v.data || "")}" aria-label="${esc(d.nome)} ${lbl(t, m)} data"><input class="inp" type="time" data-p="${kKey(i, t, m)}" data-k="hora" value="${esc(v.hora || "07:00")}" aria-label="hora">`; }).join("")}</div></div>`).join("")}`;
      if (st.passo === 4) { const r = fac()?.regra_notas || {};
        body = `<p style="margin:0">Regra de notas da <b>${esc(fac()?.nome || "faculdade")}</b> (já preenchida):</p>
        <ul style="margin:0;padding-left:20px">
          <li>Total de <b>${r.total ?? 100}</b> pontos por matéria; aprova com <b>${r.aprova ?? 60}</b>.</li>
          <li>P1 vale ${r.p1 ?? 20} e P2 vale ${r.p2 ?? 20}.</li>
          <li>Final: ${r.final_sem_pratica ?? 40} sem prática, ou ${r.final_teorica_com_pratica ?? 30} teórica + ${r.final_pratica ?? 10} prática.</li>
          <li>Nota de processo até ${r.processo_max ?? 20} (práticas, presença e trabalhos).</li></ul>
        <p class="muted" style="margin:0">Se alguma regra estiver diferente, avise o administrador.</p>`; }
      V.innerHTML = `<div class="hero"><h1>Vamos montar<span class="script">seu painel</span></h1></div>` + win(`Passo ${st.passo} de 4 · ${PASSOS[st.passo - 1]}`,
        `<div class="steps">${PASSOS.map((_, i) => `<i class="${i < st.passo ? "on" : ""}"></i>`).join("")}</div>
        <div class="stack">${body}</div>${err ? `<div class="msg bad">${esc(err)}</div>` : ""}
        <div class="row" style="justify-content:space-between;margin-top:18px"><button class="btn ghost" data-a="volta" ${st.passo === 1 ? "disabled" : ""}>Voltar</button>
        <button class="btn solid" data-a="segue">${st.passo === 4 ? "Concluir e abrir meu painel" : "Continuar"}</button></div>`);
    }
    function ler() {
      if (st.passo === 1) { st.nome = V.querySelector("#nome").value.trim(); st.faculdade_id = V.querySelector("#fac").value; st.semestre = V.querySelector("#sem").value; st.turma = V.querySelector("#turma").value.trim(); }
      V.querySelectorAll("[data-d]").forEach((el) => { const d = st.disc[+el.dataset.d]; if (d) d[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value.trim(); });
      V.querySelectorAll("[data-p]").forEach((el) => { (st.provas[el.dataset.p] = st.provas[el.dataset.p] || {})[el.dataset.k] = el.value; });
    }
    // Nada é obrigatório: o aluno pode continuar sem preencher e completar depois.
    function valida() { return ""; }
    const discValidas = () => st.disc.filter((d) => d.nome);
    async function salvar() {
      V.querySelector('[data-a="segue"]').disabled = true; V.querySelector('[data-a="segue"]').textContent = "Salvando…";
      try {
        let r = await sb.from("perfis").update({ nome: st.nome || null, faculdade_id: st.faculdade_id ? +st.faculdade_id : null, semestre: st.semestre ? +st.semestre : null, turma: st.turma || null }).eq("id", P.id); if (r.error) throw r.error;
        r = await sb.from("disciplinas").delete().eq("aluno_id", P.id); if (r.error) throw r.error; // recomeço limpo se a 1ª tentativa falhou no meio
        const lista = st.disc.map((d, i) => ({ d, i })).filter((x) => x.d.nome);
        if (lista.length) {
          r = await sb.from("disciplinas").insert(lista.map(({ d }, k) => ({ nome: d.nome, professor: d.professor || null, tem_pratica: !!d.tem_pratica, ordem: k }))).select("id"); if (r.error) throw r.error;
          const ids = r.data.map((x) => x.id);
          const provas = []; lista.forEach(({ d, i }, k) => kinds(d).forEach(([t, m]) => { const v = st.provas[kKey(i, t, m)]; if (v && v.data) provas.push({ disciplina_id: ids[k], tipo: t, modalidade: m, data: v.data, hora: v.hora || null }); }));
          if (provas.length) { r = await sb.from("provas").insert(provas); if (r.error) throw r.error; }
        }
        r = await sb.from("perfis").update({ onboarding_ok: true }).eq("id", P.id); if (r.error) throw r.error;
        P = await App.meuPerfil(); toast("Painel pronto!"); home();
      } catch (e) { draw("Não consegui salvar: " + (e.message || e)); }
    }
    V.onclick = async (e) => {
      const b = e.target.closest("[data-a]"); if (!b) return; ler();
      if (b.dataset.a === "addDisc") { st.disc.push({ nome: "", professor: "", tem_pratica: false }); draw(); V.querySelectorAll('[data-k="nome"]')[st.disc.length - 1]?.focus(); }
      if (b.dataset.a === "rmDisc") { st.disc.splice(+b.dataset.i, 1); draw(); }
      if (b.dataset.a === "volta") { st.passo--; draw(); }
      if (b.dataset.a === "segue") { const err = valida(); if (err) return draw(err); if (st.passo < 4) { st.passo++; draw(); window.scrollTo(0, 0); } else salvar(); }
    };
    draw();
  }

  /* ================= INÍCIO (os módulos completos chegam na Etapa 3) ================= */
  /* ================= PERFIL: nome de usuário, foto e senha ================= */
  function nomeExib() { return P.usuario || (P.nome || "").split(" ")[0] || P.email.split("@")[0]; }
  function avatarHTML(tam) {
    const ini = esc(nomeExib().slice(0, 1).toUpperCase());
    return P.avatar_url ? `<img src="${esc(P.avatar_url)}" alt="" width="${tam}" height="${tam}">` : `<span>${ini}</span>`;
  }
  function pintarEu() {
    document.getElementById("eu").hidden = false;
    document.getElementById("euAv").innerHTML = avatarHTML(28);
    document.getElementById("euNome").textContent = nomeExib();
  }
  async function reduzirFoto(file) {
    const img = await createImageBitmap(file);
    const lado = Math.min(img.width, img.height), T = 320;
    const c = document.createElement("canvas"); c.width = T; c.height = T;
    c.getContext("2d").drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, T, T);
    return await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.86));
  }
  function perfilTela(recuperando) {
    if (recuperando) sessionStorage.setItem("recuperando", "1");
    const voltar = () => { if (location.hash) history.replaceState(null, "", location.pathname); if (!App.acessoOk(P) && !P.is_admin) return location.reload(); return P.onboarding_ok ? home() : onboarding(); };
    V.onclick = null;
    V.innerHTML = `<div class="hero"><h1>Meu<span class="script">perfil</span></h1></div>`
      + (recuperando ? "" : win("Foto e nome", `<div class="perfil">
          <div class="av av-g" id="avG">${avatarHTML(96)}</div>
          <div class="stack" style="flex:1;min-width:0">
            <label class="field"><span class="mono">Nome de usuário</span><input id="usuario" maxlength="30" value="${esc(P.usuario || nomeExib())}"></label>
            <div class="row"><label class="btn" style="cursor:pointer">Escolher foto<input type="file" id="foto" accept="image/jpeg,image/png,image/webp" hidden></label>
            ${P.avatar_url ? `<button class="btn ghost" id="tirarFoto">Remover foto</button>` : ""}<button class="btn solid" id="salvarPerfil">Salvar</button></div>
            <span class="muted" style="font-size:13px">${esc(P.email)}</span>
          </div></div><div id="msgPerfil"></div>`))
      + win(recuperando ? "Crie sua senha nova" : "Trocar senha", `<form id="fSenha" class="stack" style="max-width:380px">
          <label class="field"><span class="mono">Senha nova</span><input id="s1" type="password" minlength="8" autocomplete="new-password" required></label>
          <label class="field"><span class="mono">Repita a senha</span><input id="s2" type="password" minlength="8" autocomplete="new-password" required></label>
          <button class="btn solid">Salvar senha</button></form><div id="msgSenha"></div>`)
      + (recuperando ? "" : `<div class="row" style="margin-top:16px"><button class="btn ghost" id="voltar">Voltar ao painel</button></div>`);
    let novaFoto = null;
    const q = (id) => document.getElementById(id);
    if (q("voltar")) q("voltar").onclick = voltar;
    if (q("foto")) q("foto").onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > 15 * 1024 * 1024) return toast("Foto muito grande.");
      try { novaFoto = await reduzirFoto(f); q("avG").innerHTML = `<img src="${URL.createObjectURL(novaFoto)}" alt="" width="96" height="96">`; }
      catch (_) { toast("Não consegui abrir essa imagem."); }
    };
    if (q("tirarFoto")) q("tirarFoto").onclick = async () => {
      const { error } = await sb.from("perfis").update({ avatar_url: null }).eq("id", P.id);
      if (error) return toast("Erro: " + error.message);
      await sb.storage.from("avatares").remove([`${P.id}/foto.jpg`]);
      P.avatar_url = null; pintarEu(); perfilTela(); toast("Foto removida");
    };
    if (q("salvarPerfil")) q("salvarPerfil").onclick = async () => {
      const b = q("salvarPerfil"), usuario = q("usuario").value.trim();
      if (usuario.length < 2) return (q("msgPerfil").innerHTML = `<div class="msg bad">O nome de usuário precisa ter pelo menos 2 letras.</div>`);
      b.disabled = true; b.textContent = "Salvando…";
      try {
        const upd = { usuario };
        if (novaFoto) {
          const caminho = `${P.id}/foto.jpg`;
          const up = await sb.storage.from("avatares").upload(caminho, novaFoto, { upsert: true, contentType: "image/jpeg", cacheControl: "60" });
          if (up.error) throw up.error;
          upd.avatar_url = sb.storage.from("avatares").getPublicUrl(caminho).data.publicUrl + "?v=" + Date.now();
        }
        const { error } = await sb.from("perfis").update(upd).eq("id", P.id); if (error) throw error;
        Object.assign(P, upd); novaFoto = null; pintarEu(); toast("Perfil salvo");
        q("msgPerfil").innerHTML = "";
      } catch (e) { q("msgPerfil").innerHTML = `<div class="msg bad">Não consegui salvar: ${esc(e.message || e)}</div>`; }
      b.disabled = false; b.textContent = "Salvar";
    };
    q("fSenha").onsubmit = async (e) => {
      e.preventDefault();
      const s1 = q("s1").value, s2 = q("s2").value;
      if (s1.length < 8) return (q("msgSenha").innerHTML = `<div class="msg bad">Use pelo menos 8 caracteres.</div>`);
      if (s1 !== s2) return (q("msgSenha").innerHTML = `<div class="msg bad">As duas senhas não são iguais.</div>`);
      const { error } = await sb.auth.updateUser({ password: s1 });
      if (error) return (q("msgSenha").innerHTML = `<div class="msg bad">${/same|different/i.test(error.message) ? "A senha nova precisa ser diferente da atual." : "Não consegui trocar: " + esc(error.message)}</div>`);
      sessionStorage.removeItem("recuperando"); toast("Senha salva");
      if (recuperando) return voltar();
      q("fSenha").reset(); q("msgSenha").innerHTML = `<div class="msg">Senha trocada. Use a nova no próximo login.</div>`;
    };
  }

  async function home() {
    V.onclick = null;
    const [{ data: disc }, { data: provas }] = await Promise.all([
      sb.from("disciplinas").select("*").order("ordem"),
      sb.from("provas").select("*").gte("data", App.isoHoje()).order("data").order("hora"),
    ]);
    const nomeD = (id) => (disc || []).find((d) => d.id === id)?.nome || "";
    const dias = (d) => Math.round((new Date(d + "T00:00") - App.hoje()) / 864e5);
    const prox = (provas || []).slice(0, 6).map((p) => { const n = dias(p.data);
      return `<div class="card"><span class="mono">${esc(p.tipo)} ${p.modalidade === "pratica" ? "prática" : "teórica"} · ${new Date(p.data + "T12:00").toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit" })}${p.hora ? " · " + p.hora.slice(0, 5) : ""}</span><h3>${esc(nomeD(p.disciplina_id))}</h3><div class="big tnum">${n === 0 ? "Hoje" : n === 1 ? "Amanhã" : n + " dias"}</div></div>`; }).join("");
    V.innerHTML = `<div class="hero"><h1>Olá, ${esc((P.nome || "").split(" ")[0] || "")}<span class="script">bons estudos</span></h1></div>`
      + win("Próximas provas", prox ? `<div class="cards">${prox}</div>` : `<div class="empty">Nenhuma prova futura cadastrada.</div>`)
      + win("Minhas matérias", (disc || []).length ? `<div class="cards">${disc.map((d) => `<div class="card"><h3>${esc(d.nome)}</h3><span class="muted" style="font-size:13px">${esc(d.professor || "")}</span>${d.tem_pratica ? `<span class="chip s-warn" style="align-self:flex-start">tem prática</span>` : ""}</div>`).join("")}</div>` : `<div class="empty">Nenhuma matéria.</div>`)
      + win("Meu Google Drive", `<div id="drv"><p class="muted" style="margin:0">Carregando…</p></div>`)
      + win("Em breve", `<p style="margin:0" class="muted">Agenda de estudos, temas de cada prova, resumos, banco de questões e calculadora de pontos chegam na próxima etapa.</p>`);
    driveTela(disc || []);
  }

  /* ================= GOOGLE DRIVE: ligar a pasta e importar os materiais ================= */
  // Duas formas: compartilhar a pasta com o e-mail de leitura do site, ou entrar com o Google.
  // O servidor (drive-varrer) lê a pasta e as subpastas, liga cada arquivo à matéria e cria os temas.
  // Resumos NÃO são gerados aqui: só quando o aluno pede.
  async function chamar(nome, body) {
    const { data, error } = await sb.functions.invoke(nome, { body });
    let erro = data?.erro, generico = false;
    if (!erro && error) { try { erro = (await error.context.json()).erro } catch (_) { } if (!erro) { erro = "O servidor não respondeu. Tente de novo."; generico = true; } }
    if (erro) { const e = new Error(erro); e.generico = generico; throw e; }
    return data;
  }
  function quando(t) { return t ? new Date(t).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "nunca"; }
  async function driveTela(disc) {
    const box = document.getElementById("drv"); if (!box) return;
    const [{ data: fontes, error: e1 }, { data: mats, error: e2 }] = await Promise.all([
      sb.from("drive_fontes").select("id,tipo,pasta_id,pasta_nome,status,erro,ultima_varredura").order("criado_em"),
      sb.from("materiais").select("id,nome,status,disciplina_id,caminho,erro").order("nome"),
    ]);
    if (!document.getElementById("drv")) return;
    if (e1 || e2) { box.innerHTML = `<div class="msg bad" style="margin:0">Não consegui carregar a parte do Drive: ${esc((e1 || e2).message)}</div>`; return; }
    const F = { compartilhada: (fontes || []).find((f) => f.tipo === "compartilhada"), google: (fontes || []).find((f) => f.tipo === "google") };
    if (DRV.volta) { if (VOLTA_MSG[DRV.volta]) toast(VOLTA_MSG[DRV.volta]); DRV.aba = "google"; DRV.volta = ""; }
    if (!DRV.aba) DRV.aba = F.google && !F.compartilhada ? "google" : "compartilhada";
    const ligadas = (fontes || []).filter((f) => f.pasta_id);
    const email = App.C.DRIVE_EMAIL_LEITOR || "";
    const form = (tipo, f) => `<form class="row" data-tipo="${tipo}"><label class="field" style="flex:1 1 240px"><span class="mono">Link da pasta</span>
      <input name="pasta" inputmode="url" autocomplete="off" placeholder="https://drive.google.com/drive/folders/..." aria-label="Link da pasta do Google Drive"></label>
      <button class="btn solid" ${DRV.ocupado ? "disabled" : ""}>${f?.pasta_id ? "Trocar pasta" : "Ligar pasta"}</button></form>`;

    const status = ligadas.length || F.google ? `<div class="stack" style="gap:8px">${["compartilhada", "google"].map((t) => { const f = F[t]; if (!f) return "";
      const [cls, txt] = DRV_STATUS[f.status] || ["s-warn", f.status];
      return `<div class="drv-fonte"><div style="min-width:0"><span class="mono">${t === "google" ? "Conta Google" : "Pasta compartilhada"}</span>
        <div><b>${f.pasta_id ? esc(f.pasta_nome || "Pasta") : "Falta colar o link da pasta"}</b></div>
        <span class="muted" style="font-size:13px">Última leitura: ${esc(quando(f.ultima_varredura))}</span>
        ${f.erro ? `<div style="font-size:13.5px;color:var(--bad)">${esc(f.erro)}</div>` : ""}</div>
        <div class="row" style="align-items:center"><span class="chip ${cls}">${esc(txt)}</span>
        <button class="btn ghost" data-drv="${t === "google" ? "desconectar" : "desligar"}" data-id="${esc(f.id)}" ${DRV.ocupado ? "disabled" : ""}>${t === "google" ? "Desconectar" : "Desligar"}</button></div></div>`; }).join("")}
      ${ligadas.length ? `<div class="row"><button class="btn solid" data-drv="varrer" ${DRV.ocupado ? "disabled" : ""}>${DRV.ocupado ? "Lendo…" : "Varrer agora"}</button></div>` : ""}</div>` : "";

    const abaComp = `<ol class="drv-passos">
        <li>No Google Drive, clique com o botão direito na pasta das suas matérias e escolha <b>Compartilhar</b>.</li>
        <li>Adicione este e-mail como <b>Leitor</b> e clique em Enviar:<div class="row" style="align-items:center;margin-top:6px"><span class="drv-mail">${esc(email)}</span><button type="button" class="btn" data-drv="copiar">Copiar e-mail</button></div></li>
        <li>Abra a pasta, copie o link da barra de endereço e cole aqui:</li></ol>${form("compartilhada", F.compartilhada)}`;
    const g = F.google;
    const abaGoogle = !g ? `<p style="margin:0">Entre com a sua conta Google. O site só consegue <b>ler</b> seus arquivos: nunca altera nem apaga nada.</p>
        <div class="row"><button class="btn solid" data-drv="google" ${DRV.ocupado ? "disabled" : ""}>Entrar com o Google</button></div>`
      : g.status === "reconectar" ? `<div class="msg bad" style="margin:0">${esc(g.erro || "A conexão com o Google expirou. Conecte de novo.")}</div>
        <div class="row"><button class="btn solid" data-drv="google" ${DRV.ocupado ? "disabled" : ""}>Conectar de novo</button></div>`
      : `<p style="margin:0"><span class="chip s-ok">conectado</span> ${g.pasta_id ? "Para usar outra pasta, cole o link novo:" : "Agora cole o link da pasta das suas matérias:"}</p>${form("google", g)}`;

    // materiais agrupados por matéria
    const grupos = (disc || []).map((d) => ({ nome: d.nome, itens: (mats || []).filter((m) => m.disciplina_id === d.id) }))
      .concat([{ nome: "Sem matéria", sem: true, itens: (mats || []).filter((m) => !m.disciplina_id || !(disc || []).some((d) => d.id === m.disciplina_id)) }])
      .filter((x) => x.itens.length);
    const abrir = (mats || []).length <= 30;
    const lista = !(mats || []).length ? (ligadas.length ? `<div class="empty">Nenhum material importado ainda. Clique em "Varrer agora".</div>` : "")
      : `<h3 style="margin-top:6px">Materiais importados (${mats.length})</h3>
        <p class="muted" style="margin:0;font-size:13.5px">Cada arquivo vira um tema da matéria. Os resumos não são feitos sozinhos: você pede o resumo de um tema quando quiser.</p>
        <div>${grupos.map((x) => `<details class="drv-grupo" ${abrir ? "open" : ""}><summary><b>${esc(x.nome)}</b> <span class="muted">· ${x.itens.length} ${x.itens.length === 1 ? "arquivo" : "arquivos"}</span></summary>
          ${x.sem ? `<p class="muted" style="margin:6px 0 0;font-size:13px">Para ligar à matéria, coloque o arquivo numa subpasta com o nome dela (ex.: "${esc((disc || [])[0]?.nome || "Farmacologia 2")}").</p>` : ""}
          <ul class="drv-lista">${x.itens.map((m) => { const [cls, txt] = MAT_STATUS[m.status] || ["s-warn", m.status];
            return `<li><span class="drv-nome" title="${esc(m.caminho || "")}">${esc(m.nome)}</span><span class="chip ${cls}" ${m.erro ? `title="${esc(m.erro)}"` : ""}>${esc(txt)}</span></li>`; }).join("")}</ul></details>`).join("")}</div>`;

    box.innerHTML = `<div class="stack">${status}
      <div class="row" role="tablist" aria-label="Como ligar a pasta">
        <button class="btn ${DRV.aba === "compartilhada" ? "solid" : ""}" role="tab" aria-selected="${DRV.aba === "compartilhada"}" data-drv="aba" data-v="compartilhada">Compartilhar uma pasta</button>
        <button class="btn ${DRV.aba === "google" ? "solid" : ""}" role="tab" aria-selected="${DRV.aba === "google"}" data-drv="aba" data-v="google">Entrar com o Google</button></div>
      <div class="stack" role="tabpanel">${DRV.aba === "google" ? abaGoogle : abaComp}</div>
      <p class="muted" style="margin:0;font-size:13.5px">Dica: deixe uma subpasta para cada matéria, com o nome parecido com o do painel (ex.: "Farmacologia 2"). O site lê PDF, Word, PowerPoint, Google Docs, Google Slides e textos.</p>
      <div id="drvProg">${DRV.msg ? `<div class="msg ${DRV.msg.bad ? "bad" : ""}" style="margin:0">${esc(DRV.msg.t)}</div>` : ""}</div>
      ${lista}</div>`;

    box.onsubmit = (e) => {
      e.preventDefault(); if (DRV.ocupado) return;
      const pasta = e.target.pasta.value.trim();
      if (!pasta) return toast("Cole o link da pasta.");
      varrer(disc, { pasta, tipo: e.target.dataset.tipo });
    };
    box.onclick = async (e) => {
      const b = e.target.closest("[data-drv]"); if (!b || DRV.ocupado) return;
      const a = b.dataset.drv;
      if (a === "aba") { DRV.aba = b.dataset.v; DRV.msg = null; return driveTela(disc); }
      if (a === "copiar") {
        try { await navigator.clipboard.writeText(email); toast("E-mail copiado"); }
        catch (_) { const r = document.createRange(); r.selectNodeContents(box.querySelector(".drv-mail")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Selecione e copie o e-mail"); }
      }
      if (a === "varrer") return varrer(disc);
      if (a === "google") {
        b.disabled = true; b.textContent = "Abrindo o Google…";
        try { const { url } = await chamar("drive-oauth", { acao: "url" }); location.href = url; }
        catch (err) { DRV.msg = { bad: true, t: err.message }; driveTela(disc); }
      }
      if (a === "desligar") {
        if (!confirm("Desligar esta pasta? Os materiais importados dela saem do painel. Os temas que você já tem continuam.")) return;
        const { error } = await sb.from("drive_fontes").delete().eq("id", b.dataset.id);
        DRV.msg = error ? { bad: true, t: "Não consegui desligar: " + error.message } : null;
        if (!error) toast("Pasta desligada"); driveTela(disc);
      }
      if (a === "desconectar") {
        if (!confirm("Desconectar sua conta Google? Os materiais importados por ela saem do painel. Os temas continuam.")) return;
        try { await chamar("drive-oauth", { acao: "desconectar" }); DRV.msg = null; toast("Google desconectado"); }
        catch (err) { DRV.msg = { bad: true, t: err.message }; }
        driveTela(disc);
      }
    };
  }
  // Chama o servidor até acabar de ler tudo (cada chamada lê o que der em ~1,5 min)
  async function varrer(disc, ligar) {
    if (DRV.ocupado) return;
    DRV.ocupado = true; DRV.msg = null; await driveTela(disc);
    const prog = () => document.getElementById("drvProg");
    let corpo = ligar || {}, voltas = 0, falhas = 0, r = null;
    try {
      while (voltas < 40) {
        if (prog()) prog().innerHTML = `<div class="msg" style="margin:0" aria-live="polite">${r ? `Lendo os arquivos… ${r.arquivos - r.restantes} de ${r.arquivos} prontos.` : ligar ? "Abrindo a pasta…" : "Lendo sua pasta…"} Pode levar alguns minutos.</div>`;
        try { r = await chamar("drive-varrer", corpo); }
        catch (e) { if (!e.generico || ++falhas > 2) throw e; continue; } // queda do servidor: tenta de novo
        corpo = {}; voltas++; falhas = 0;
        if (r.feito || !r.restantes) break;
      }
      const partes = [`${r.arquivos} ${r.arquivos === 1 ? "arquivo" : "arquivos"}`];
      if (r.novos) partes.push(`${r.novos} ${r.novos === 1 ? "novo" : "novos"}`);
      if (r.atualizados) partes.push(`${r.atualizados} ${r.atualizados === 1 ? "atualizado" : "atualizados"}`);
      if (r.removidos) partes.push(`${r.removidos} ${r.removidos === 1 ? "removido" : "removidos"}`);
      const comErro = (r.fontes || []).find((f) => f.status === "erro" || f.status === "reconectar");
      DRV.msg = comErro ? { bad: true, t: comErro.erro || "Não consegui ler uma das pastas." }
        : { t: `Pronto: ${partes.join(", ")}.${r.sem_materia ? ` ${r.sem_materia} sem matéria (veja no fim da lista).` : ""}` };
      if (ligar) toast("Pasta ligada");
    } catch (e) { DRV.msg = { bad: true, t: e.message }; }
    DRV.ocupado = false;
    await driveTela(disc);
  }
})();
</script>
</body>
</html>
