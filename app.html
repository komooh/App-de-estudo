<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel de Estudos</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Mono:wght@400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/app.html">Painel de Estudos</a>
    <div class="row" style="align-items:center"><button class="btn ghost cfg-btn tarefas-btn" id="tarefasBtn" hidden aria-expanded="false" aria-haspopup="dialog" aria-label="Tarefas" title="Tarefas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span class="cfg-txt">Tarefas</span><span class="tarefas-n" hidden>0</span></button><button class="btn ghost cfg-btn" id="cfgBtn" hidden aria-label="Configurações" title="Configurações"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="cfg-txt">Configurações</span></button><button class="eu" id="eu" hidden aria-label="Meu perfil"><span class="av" id="euAv"></span><span id="euNome"></span></button><a id="lnkAdmin" class="btn ghost" href="/admin.html" hidden>Administração</a><button class="btn ghost" id="sair">Sair</button></div>
  </header>
  <main id="view"><p class="muted">Carregando…</p></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/comum.js"></script>
<script src="/assets/rodape.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
<script src="/assets/leitor.js"></script>
<script src="/assets/extrair.js"></script>
<script src="/assets/fila.js"></script>
<script src="/assets/tarefas.js"></script>
<script src="/assets/importar.js"></script>
<script src="/assets/painel.js"></script>
<script>
(async () => {
  const { sb, esc, toast, win } = App;
  const V = document.getElementById("view");
  // link de "esqueci a senha": o Supabase manda type=recovery na URL (lido antes de ele limpar a URL)
  if (/type=recovery/.test(location.hash)) sessionStorage.setItem("recuperando", "1");
  // volta do link de troca de e-mail: "type=email_change" (as duas confirmações feitas) ou a mensagem
  // "Confirmation link accepted..." (falta confirmar no outro e-mail)
  const emailVolta = /type=email_change/.test(location.hash) ? "ok" : /message=Confirmation(\+|%20)link(\+|%20)accepted/i.test(location.hash) ? "metade"
    : /error_description=[^&]*(email|link)/i.test(location.hash) ? "erro" : "";
  if (emailVolta === "metade" || emailVolta === "erro") history.replaceState(null, "", location.pathname);
  document.getElementById("sair").onclick = App.sair;

  // Espera o Supabase ler o link mágico da URL (se veio do e-mail)
  const s = await App.sessao();
  if (!s) { location.replace("/"); return; }
  // volta da tela do Google ("Entrar com o Google"): #drive=conectado | negado | expirou | erro
  const driveVolta = (location.hash.match(/drive=([a-z_]+)/) || [])[1] || "";
  if (driveVolta) history.replaceState(null, "", location.pathname);
  const DRV = { aba: null, ocupado: false, msg: null, volta: driveVolta };
  const DRV_STATUS = { ok: ["s-ok", "em dia"], varrendo: ["s-warn", "lendo"], pendente: ["s-warn", "falta ler"], erro: ["s-bad", "erro"], reconectar: ["s-bad", "reconectar"] };
  const MAT_STATUS = { ok: ["s-ok", "lido"], pendente: ["s-ok", "pronto"], sem_texto: ["s-warn", "sem texto"], grande_demais: ["s-warn", "grande demais"], erro: ["s-bad", "erro"] };
  // livros (o resto do código dos livros está no fim, em "LIVROS")
  const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/";
  const JSZIP = { src: "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js", sri: "sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" };
  const LIV = { ocupado: false, aberto: false, msg: null, arq: null, pdf: null, busca: "", res: null };
  const LIV_STATUS = { ok: ["s-ok", "pronto"], processando: ["s-warn", "incompleto"], erro: ["s-bad", "erro"] };
  const FORMATOS = { pdf: "PDF", epub: "EPUB", docx: "Word", txt: "Texto" };
  let pdfjsLib = null;
  const SEG = { codigo: false, msg: null }; // troca de senha com código (perfil)
  async function carregarPdfjs() {
    if (pdfjsLib) return pdfjsLib;
    pdfjsLib = await import(PDFJS + "pdf.min.mjs");
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.mjs";
    return pdfjsLib;
  }
  function carregarJSZip() {
    if (window.JSZip) return Promise.resolve(window.JSZip);
    return new Promise((ok, falha) => { const s = document.createElement("script"); s.src = JSZIP.src; s.integrity = JSZIP.sri; s.crossOrigin = "anonymous";
      s.onload = () => ok(window.JSZip); s.onerror = () => falha(new Error("Não consegui carregar o leitor de EPUB/Word. Confira a internet.")); document.head.appendChild(s); });
  }
  const formatoDe = (f) => { const ext = (f.name.match(/\.([a-z0-9]+)$/i) || [])[1]?.toLowerCase();
    return ext === "pdf" || f.type === "application/pdf" ? "pdf" : ext === "epub" ? "epub" : ext === "docx" ? "docx" : ext === "txt" || ext === "md" ? "txt" : null; };
  const tituloDoArquivo = (n) => n.replace(/\.[a-z0-9]+$/i, "").replace(/[_]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 300);
  // texto limpo: sem caracteres de controle (o banco recusa \0), palavras hifenizadas no fim da linha juntadas
  const limpar = (t) => String(t || "").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, " ")
    .replace(/(\p{L})-\s*\n\s*(\p{Ll})/gu, "$1$2").replace(/\s+/g, " ").trim();
  const onde = (t, formato) => { // "p. 10" / "p. 10 a 11" / "seção 3"
    if (t.pagina_ini == null) return "";
    const pal = formato === "pdf" ? "p." : "seção";
    return t.pagina_fim && t.pagina_fim !== t.pagina_ini ? `${pal} ${t.pagina_ini} a ${t.pagina_fim}` : `${pal} ${t.pagina_ini}`;
  };

  const VOLTA_MSG = { conectado: "Google conectado. Agora cole o link da pasta.", negado: "Você não deu a permissão no Google.",
    expirou: "O pedido expirou. Tente conectar de novo.", sem_permissao: "Marque a permissão de ver os arquivos do Drive e tente de novo.", erro: "Não consegui conectar com o Google. Tente de novo." };
  let P;
  // semestres: ok=false quando o 04_semestres.sql ainda não rodou (o painel funciona do jeito antigo)
  let SEM = { ok: false, atual: null, lista: [] };
  async function carregarSemestres() {
    const { data, error } = await sb.from("semestres").select("*").order("inicio").order("id");
    SEM = error ? { ok: false, atual: null, lista: [] } : { ok: true, lista: data || [], atual: (data || []).find((x) => x.atual) || null };
    return SEM;
  }
  const nomeSem = (x) => x?.numero ? `${x.numero}º semestre` : "Semestre sem número";
  const dataBR = (d) => d ? new Date(d + "T12:00").toLocaleDateString("pt-BR") : "";
  try { P = await App.meuPerfil(); } catch (e) { V.innerHTML = `<div class="msg bad">Não consegui carregar seu perfil: ${esc(e.message)}</div>`; return; }
  pintarEu();
  if (emailVolta) toast(emailVolta === "ok" ? `E-mail trocado. Agora você entra com ${P.email}.` : emailVolta === "metade" ? "Confirmado neste e-mail. Falta clicar no link que foi para o outro e-mail." : "O link de confirmação do e-mail venceu ou já foi usado. Peça de novo no seu perfil.");
  document.getElementById("eu").onclick = () => perfilTela();
  document.getElementById("cfgBtn").onclick = () => abrirConfig();
  if (P.is_admin) document.getElementById("lnkAdmin").hidden = false;
  // termos de uso: a versão atual vem do banco (09_termos.sql); aceite pendente = tela de aceite antes de tudo
  const TERMOS = { atual: null, pendente: false, erro: null };
  const ITENS_TERMOS = [
    `Li e aceito os <a href="/termos.html" target="_blank" rel="noopener">Termos de Uso</a> e a <a href="/privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>.`,
    "Entendo que os resumos, questões e mapas são gerados por inteligência artificial, podem conter erros e não substituem os livros, o professor nem orientação profissional; devo conferir o conteúdo.",
    "Entendo que as informações que eu colocar no site (materiais, notas, textos, livros) ficam gravadas e armazenadas para o funcionamento do serviço.",
    "Declaro que tenho direito de usar os arquivos e livros que eu enviar e assumo a responsabilidade por eles.",
    "Declaro ter 18 anos ou mais.",
  ];
  await checarTermos();
  // veio do e-mail de "esqueci a senha": pede a senha nova antes de tudo (depois vem o aceite dos termos)
  if (sessionStorage.getItem("recuperando") === "1") return perfilTela(true);
  return seguir();

  // Depois do login: aceite dos termos, depois acesso, configuração guiada e o painel.
  async function seguir() {
    if (TERMOS.erro) return termosErro();
    if (TERMOS.pendente) return termosTela();
    if (!App.acessoOk(P)) {
      const venceu = P.ativo && P.vence_em;
      V.innerHTML = `<div class="hero"><h1>Acesso<span class="script">${venceu ? "vencido" : "pendente"}</span></h1></div>` + win("Seu acesso",
        `<p style="margin:0">${venceu ? `Sua assinatura venceu em <b>${new Date(P.vence_em + "T12:00").toLocaleDateString("pt-BR")}</b>. Fale com o administrador para renovar; seus dados continuam guardados.` : "Sua conta ainda não foi liberada. Fale com o administrador da sua turma."}</p>`);
      if (!P.is_admin) return;
    }
    if (!P.onboarding_ok) return onboarding();
    document.getElementById("cfgBtn").hidden = false;
    return home();
  }

  /* ================= ACEITE DOS TERMOS (primeira entrada e quando a versão muda) ================= */
  async function checarTermos() {
    const { data, error } = await sb.rpc("termos_versao_atual");
    if (error) {
      // 09_termos.sql ainda não rodou no Supabase: o site segue como antes (sem a tela de aceite)
      if (/termos_versao_atual|schema cache|could not find/i.test(error.message || "")) { TERMOS.pendente = false; return; }
      TERMOS.erro = error.message || "erro"; return;
    }
    TERMOS.atual = data; TERMOS.erro = null;
    TERMOS.pendente = Number.isInteger(data) && !(P.termos_versao >= data);
  }
  function termosErro() {
    V.innerHTML = win("Termos de uso", `<p style="margin:0">Não consegui conferir os termos de uso agora. Confira a internet e tente de novo.</p>
      <div class="row" style="margin-top:14px"><button class="btn solid" id="termosDeNovo">Tentar de novo</button></div>`);
    document.getElementById("termosDeNovo").onclick = () => location.reload();
  }
  function termosTela() {
    window.Painel?.fechar(); V.onclick = null; V.onchange = null;
    V.innerHTML = "";
    const topo = ["eu", "lnkAdmin", "cfgBtn", "tarefasBtn"].map((id) => document.getElementById(id));
    const antes = topo.map((el) => el.hidden); topo.forEach((el) => { el.hidden = true; });
    const fundo = [...document.body.children]; fundo.forEach((el) => { el.inert = true; el.setAttribute("aria-hidden", "true"); });
    const mudou = P.termos_versao != null;
    const g = document.createElement("div");
    g.className = "gate"; g.id = "termosGate"; g.setAttribute("role", "dialog"); g.setAttribute("aria-modal", "true"); g.setAttribute("aria-labelledby", "termosTit"); g.setAttribute("aria-describedby", "termosDesc");
    g.innerHTML = `<div class="gate-in"><span class="brand">${esc(App.C.NOME_PRODUTO || "Painel de Estudos")}</span>
      <h1 id="termosTit" tabindex="-1">${mudou ? "Os termos mudaram" : "Antes de começar"}</h1>
      <p id="termosDesc" style="margin:0 0 4px">${mudou ? "Atualizamos os termos de uso desde o seu último aceite. Leia a versão nova e marque os itens para continuar." : "Leia e marque os itens abaixo para usar o site. Você faz isso uma vez (e de novo só se os termos mudarem)."}</p>`
      + win("Termos de uso", `<form id="fTermos" novalidate><fieldset style="border:0;margin:0;padding:0"><legend class="mono" style="padding:0;margin-bottom:10px">Marque todos os itens</legend>
        <ul class="gate-lista">${ITENS_TERMOS.map((t, i) => `<li><label class="gate-item" for="tAc${i}"><input type="checkbox" id="tAc${i}" name="t${i}" required><span>${t}</span></label></li>`).join("")}</ul></fieldset>
        <p class="gate-falta" id="termosFalta" aria-live="polite"></p><div id="termosMsg" role="alert"></div>
        <div class="gate-acoes"><button type="button" class="gate-recusar" id="termosRecusar">Recusar e sair</button>
        <button class="btn solid" id="termosOk" disabled aria-describedby="termosFalta">Aceitar e continuar</button></div></form>`) + `</div>`;
    document.body.appendChild(g);
    const caixas = [...g.querySelectorAll('input[type="checkbox"]')], ok = g.querySelector("#termosOk"), falta = g.querySelector("#termosFalta");
    const atualizar = () => { const n = caixas.filter((c) => c.checked).length; ok.disabled = n < caixas.length;
      falta.textContent = n < caixas.length ? `Marque os ${caixas.length} itens para continuar (${n} de ${caixas.length}).` : "Tudo marcado. Pode continuar."; };
    g.addEventListener("change", atualizar); atualizar();
    g.querySelector("#termosRecusar").onclick = () => App.sair();
    g.querySelector("#fTermos").onsubmit = async (e) => {
      e.preventDefault(); if (caixas.some((c) => !c.checked)) return;
      ok.disabled = true; ok.textContent = "Salvando…"; g.querySelector("#termosMsg").innerHTML = "";
      const { error } = await sb.rpc("aceitar_termos", { p_versao: TERMOS.atual });
      if (error) {
        const mudouAgora = /mudaram|recarregue/i.test(error.message || "");
        g.querySelector("#termosMsg").innerHTML = `<div class="msg bad">${mudouAgora ? "Os termos acabaram de mudar. Recarregue a página para ler a versão nova." : "Não consegui salvar o aceite: " + esc(error.message)}</div>`
          + (mudouAgora ? `<button type="button" class="btn" style="margin-top:8px" onclick="location.reload()">Recarregar</button>` : "");
        ok.textContent = "Aceitar e continuar"; atualizar(); return;
      }
      try { P = await App.meuPerfil(); } catch (_) { P.termos_versao = TERMOS.atual; }
      TERMOS.pendente = false;
      g.remove(); fundo.forEach((el) => { el.inert = false; el.removeAttribute("aria-hidden"); });
      topo.forEach((el, i) => { el.hidden = antes[i]; });
      toast("Termos aceitos"); seguir();
    };
    g.querySelector("#termosTit").focus();
  }

  /* ================= CONFIGURAÇÃO GUIADA (primeira entrada) ================= */
  // novo=true: "Adicionar semestre" (o semestre de agora fica guardado; só o novo é montado)
  async function onboarding(novo) {
    window.Painel?.fechar(); V.onclick = null;
    const [{ data: facs }, { data: catalogo }] = await Promise.all([sb.from("faculdades").select("*").eq("ativa", true).order("nome"),
      sb.from("catalogo_materias").select("faculdade_id,semestre,nome,ordem").order("ordem"), carregarSemestres()]);
    const numAtual = +(SEM.atual?.numero || P.semestre || 0);
    const st = { passo: 1, nome: P.nome || "", faculdade_id: P.faculdade_id || facs?.[0]?.id || null,
      semestre: novo ? (numAtual ? Math.min(numAtual + 1, 12) : "") : (P.semestre || ""), turma: App.limparTurma((novo ? SEM.atual?.turma : null) || P.turma || ""),
      disc: [{ nome: "", professor: "", tem_pratica: false }], provas: {}, semId: null, catChave: "", catLista: null, catVazio: false, cal: {} };
    // Matérias do catálogo para a faculdade + semestre escolhidos (o aluno pode mudar tudo depois)
    const doCatalogo = () => (catalogo || []).filter((c) => c.faculdade_id == st.faculdade_id && c.semestre == st.semestre).map((c) => c.nome);
    const assinatura = (lista) => JSON.stringify(lista.map((d) => [d.nome, d.professor, !!d.tem_pratica]));
    function preencherDoCatalogo() {
      const chave = `${st.faculdade_id}|${st.semestre}`;
      if (!st.semestre || chave === st.catChave) return;
      const nomes = doCatalogo();
      const digitou = st.disc.some((d) => d.nome || d.professor) && (!st.catLista || assinatura(st.disc) !== st.catLista);
      st.catChave = chave; st.catVazio = !nomes.length;
      if (digitou && !confirm(nomes.length ? `Trocar as matérias que você colocou pela lista do ${st.semestre}º semestre?` : `Ainda não temos a lista do ${st.semestre}º semestre. Apagar as matérias que você colocou e começar do zero?`)) { st.catLista = null; return; }
      st.disc = nomes.length ? nomes.map((nome) => ({ nome, professor: "", tem_pratica: false })) : [{ nome: "", professor: "", tem_pratica: false }];
      st.provas = {}; st.catLista = nomes.length ? assinatura(st.disc) : null;
    }
    const PASSOS = ["Você", "Matérias", "Provas", "Notas"];
    const fac = () => (facs || []).find((f) => f.id == st.faculdade_id);
    const kinds = (d) => [["P1", "teorica"], ["P2", "teorica"], ["Final", "teorica"], ...(d.tem_pratica ? [["P1", "pratica"], ["P2", "pratica"], ["Final", "pratica"]] : [])];
    const kKey = (i, t, m) => `${i}|${t}|${m}`;
    const lbl = (t, m) => `${t} ${m === "pratica" ? "prática" : "teórica"}`;
    function draw(err) {
      let body = "";
      if (st.passo === 1) body = (novo ? `<p class="muted" style="margin:0">O ${esc(nomeSem(SEM.atual).toLowerCase())} fica guardado do jeito que está: matérias, provas, notas e materiais. Você encontra ele no seu perfil, em "Semestres anteriores".</p>` : "") + `
        <label class="field"><span class="mono">Seu nome</span><input id="nome" value="${esc(st.nome)}" required></label>
        <label class="field"><span class="mono">Faculdade</span><select id="fac">${(facs || []).map((f) => `<option value="${f.id}" ${f.id == st.faculdade_id ? "selected" : ""}>${esc(f.nome)}</option>`).join("")}</select></label>
        <div class="row"><label class="field" style="flex:1"><span class="mono">Semestre</span><select id="sem"><option value="">Escolha</option>${Array.from({ length: 12 }, (_, i) => `<option ${st.semestre == i + 1 ? "selected" : ""}>${i + 1}</option>`).join("")}</select></label>
        <label class="field" style="flex:1"><span class="mono">Turma (opcional, só a letra)</span>${App.campoTurma("turma", st.turma, "turma")}</label></div>`;
      if (st.passo === 2) body = (st.catLista ? `<p style="margin:0">Já colocamos as matérias do <b>${esc(st.semestre)}º semestre</b>. Coloque o nome dos professores, tire o que não for seu e adicione o que faltar.</p>`
          : st.catVazio && st.semestre ? `<div class="msg" style="margin:0">Ainda não temos a lista deste semestre; adicione suas matérias.</div>` : "")
        + `<p class="muted" style="margin:0">${st.catLista ? "" : `Coloque as matérias ${novo ? "do semestre novo, com o nome dos professores," : "deste semestre"}. `}Marque "tem prática" nas que têm prova prática separada. Se preferir, continue e adicione depois.</p>
        ${st.disc.map((d, i) => `<div class="discrow">
          <label class="field"><span class="mono">Matéria</span><input data-d="${i}" data-k="nome" value="${esc(d.nome)}" placeholder="Ex.: Farmacologia 2"></label>
          <label class="field"><span class="mono">Professor</span><input data-d="${i}" data-k="professor" value="${esc(d.professor)}" placeholder="Opcional"></label>
          <label class="check"><input type="checkbox" data-d="${i}" data-k="tem_pratica" ${d.tem_pratica ? "checked" : ""}>tem prática</label>
          <button class="btn ghost" data-a="rmDisc" data-i="${i}" aria-label="Remover ${esc(d.nome || "matéria")}">Remover</button>
          ${/^optativa\b/i.test(d.nome) ? `<span class="disc-dica">Troque "${esc(d.nome)}" pelo nome da sua optativa (ex.: Medicina Tropical).</span>` : ""}</div>`).join("")}
        <button class="btn" data-a="addDisc" style="align-self:flex-start">+ Adicionar matéria</button>`;
      if (st.passo === 3) body = `<p class="muted" style="margin:0">Preencha as datas que você já sabe. As que ainda não saíram podem ficar em branco: é só colocar depois. A agenda monta o plano de estudo com as datas que existirem.</p>
        ${discValidas().length ? `<div class="card imp-cal"><div class="row" style="align-items:center;justify-content:space-between"><span style="flex:1 1 220px">Tem algum documento da faculdade com as datas das provas (cronograma, calendário)? A IA lê o PDF ou a foto e preenche as datas para você conferir.</span>
          <label class="btn ${st.cal.busy ? "" : "solid"}" style="cursor:pointer">Importar documento (PDF ou foto)<input type="file" id="onbCal" accept=".pdf,application/pdf,image/jpeg,image/png,image/webp" hidden ${st.cal.busy ? "disabled" : ""}></label></div>
          ${st.cal.msg ? `<div class="msg ${st.cal.msg.bad ? "bad" : ""}" style="margin:0" aria-live="polite">${esc(st.cal.msg.t)}</div>` : ""}
          ${st.cal.provas ? `<div id="calRev">${Leitor.revisaoHTML(st.cal.provas, discOpcoes())}</div><div class="row">${st.cal.provas.length ? `<button class="btn solid" data-a="calUsar">Usar estas datas</button>` : ""}<button class="btn ghost" data-a="calDesc">Cancelar</button></div>` : ""}</div>`
          : `<div class="empty">Você não colocou matérias no passo anterior. Pode continuar e adicionar depois.</div>`}
        ${st.disc.map((d, i) => !d.nome ? "" : `<div class="card"><h3>${esc(d.nome)}</h3><div class="provgrid">${kinds(d).map(([t, m]) => { const v = st.provas[kKey(i, t, m)] || {};
          return `<span class="lbl">${lbl(t, m)}</span><input class="inp" type="date" data-p="${kKey(i, t, m)}" data-k="data" value="${esc(v.data || "")}" aria-label="${esc(d.nome)} ${lbl(t, m)} data"><input class="inp" type="time" data-p="${kKey(i, t, m)}" data-k="hora" value="${esc(v.hora || "07:00")}" aria-label="hora">`; }).join("")}</div></div>`).join("")}`;
      if (st.passo === 4) { const r = fac()?.regra_notas || {};
        body = `<p style="margin:0">Regra de notas da <b>${esc(fac()?.nome || "faculdade")}</b> (já preenchida):</p>
        <ul style="margin:0;padding-left:20px">
          <li>Total de <b>${r.total ?? 100}</b> pontos por matéria; aprova com <b>${r.aprova ?? 60}</b>.</li>
          <li>P1 vale ${r.p1 ?? 20} e P2 vale ${r.p2 ?? 20}.</li>
          <li>Final: ${r.final_sem_pratica ?? 40} sem prática, ou ${r.final_teorica_com_pratica ?? 30} teórica + ${r.final_pratica ?? 10} prática.</li>
          <li>Nota de processo até ${r.processo_max ?? 20} (práticas, presença e trabalhos).</li></ul>
        <p class="muted" style="margin:0">Se alguma regra estiver diferente, avise o administrador.</p>`; }
      V.innerHTML = `<div class="hero"><h1>${novo ? "Novo" : "Vamos montar"}<span class="script">${novo ? "semestre" : "seu painel"}</span></h1></div>` + win(`Passo ${st.passo} de 4 · ${PASSOS[st.passo - 1]}`,
        `<div class="steps">${PASSOS.map((_, i) => `<i class="${i < st.passo ? "on" : ""}"></i>`).join("")}</div>
        <div class="stack">${body}</div>${err ? `<div class="msg bad">${esc(err)}</div>` : ""}
        <div class="row" style="justify-content:space-between;margin-top:18px">${novo && st.passo === 1 ? `<button class="btn ghost" data-a="cancela">Cancelar</button>` : `<button class="btn ghost" data-a="volta" ${st.passo === 1 ? "disabled" : ""}>Voltar</button>`}
        <button class="btn solid" data-a="segue">${st.passo === 4 ? (novo ? "Criar o semestre novo" : "Concluir e abrir meu painel") : "Continuar"}</button></div>`);
    }
    function ler() {
      if (st.passo === 1) { st.nome = V.querySelector("#nome").value.trim(); st.faculdade_id = V.querySelector("#fac").value; st.semestre = V.querySelector("#sem").value; st.turma = App.limparTurma(V.querySelector("#turma").value); }
      V.querySelectorAll("[data-d]").forEach((el) => { const d = st.disc[+el.dataset.d]; if (d) d[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value.trim(); });
      V.querySelectorAll("[data-p]").forEach((el) => { (st.provas[el.dataset.p] = st.provas[el.dataset.p] || {})[el.dataset.k] = el.value; });
    }
    // Nada é obrigatório: o aluno pode continuar sem preencher e completar depois.
    function valida() { return ""; }
    const discValidas = () => st.disc.filter((d) => d.nome);
    // calendário importado: as matérias ainda não estão salvas, então o "id" é a posição na lista
    const discOpcoes = () => st.disc.map((d, i) => ({ id: i, nome: d.nome })).filter((x) => x.nome);
    async function importarCalendario(file) {
      st.cal = { busy: true, msg: { t: "Abrindo o arquivo…" } }; draw();
      const passo = (t) => { ler(); st.cal.msg = { t }; draw(); };
      try {
        const prep = await Leitor.prepararCalendario(file, carregarPdfjs, passo);
        passo("A IA está lendo o calendário. Leva uns 20 segundos…");
        const op = discOpcoes();
        const r = await chamar("ia", { acao: "calendario", ...prep, semestre: st.semestre ? +st.semestre : null, turma: st.turma || null, materias: op.map((x) => x.nome) });
        const provas = (r.provas || []).map((p) => { const k = Leitor.casarMateria(p.materia, op.map((x) => x.nome)); return { ...p, disciplina_id: k >= 0 ? op[k].id : null, ok: k >= 0 }; });
        ler();
        st.cal = { provas, msg: provas.length ? { t: `Achei ${provas.length} prova${provas.length === 1 ? "" : "s"}. Confira e clique em "Usar estas datas".` } : { bad: true, t: r.aviso || "Não achei provas da sua turma nesse arquivo. Confira o semestre e a turma no passo 1." } };
      } catch (e) { ler(); st.cal = { msg: { bad: true, t: e.message || "Não consegui ler o calendário." } }; }
      draw();
    }
    async function salvar() {
      V.querySelector('[data-a="segue"]').disabled = true; V.querySelector('[data-a="segue"]').textContent = "Salvando…";
      try {
        const semDados = { numero: st.semestre ? +st.semestre : null, turma: st.turma || null, faculdade_id: st.faculdade_id ? +st.faculdade_id : null };
        let r = await sb.from("perfis").update({ nome: st.nome || null, faculdade_id: semDados.faculdade_id, semestre: semDados.numero, turma: semDados.turma }).eq("id", P.id); if (r.error) throw r.error;
        if (SEM.ok) {
          // 1ª configuração: usa o semestre atual (se já existe). Novo semestre: cria um (o anterior é encerrado pelo banco).
          if (!st.semId && !novo && SEM.atual) st.semId = SEM.atual.id;
          if (st.semId) { r = await sb.from("semestres").update(semDados).eq("id", st.semId); if (r.error) throw r.error; }
          else { r = await sb.from("semestres").insert({ ...semDados, inicio: App.isoHoje(), atual: true }).select("id").single(); if (r.error) throw r.error; st.semId = r.data.id; }
          // só as matérias DESTE semestre são refeitas (recomeço limpo se a 1ª tentativa falhou no meio)
          r = await sb.from("disciplinas").delete().eq("semestre_id", st.semId); if (r.error) throw r.error;
        } else if (novo) throw new Error("falta rodar o 04_semestres.sql no Supabase");
        else { r = await sb.from("disciplinas").delete().eq("aluno_id", P.id); if (r.error) throw r.error; }
        const lista = st.disc.map((d, i) => ({ d, i })).filter((x) => x.d.nome);
        if (lista.length) {
          r = await sb.from("disciplinas").insert(lista.map(({ d }, k) => ({ nome: d.nome, professor: d.professor || null, tem_pratica: !!d.tem_pratica, ordem: k, ...(SEM.ok ? { semestre_id: st.semId } : {}) }))).select("id"); if (r.error) throw r.error;
          const ids = r.data.map((x) => x.id);
          const provas = []; lista.forEach(({ d, i }, k) => kinds(d).forEach(([t, m]) => { const v = st.provas[kKey(i, t, m)]; if (v && v.data) provas.push({ disciplina_id: ids[k], tipo: t, modalidade: m, data: v.data, hora: v.hora || null }); }));
          if (provas.length) { r = await sb.from("provas").insert(provas); if (r.error) throw r.error; }
        }
        r = await sb.from("perfis").update({ onboarding_ok: true }).eq("id", P.id); if (r.error) throw r.error;
        P = await App.meuPerfil(); toast(novo ? `${nomeSem({ numero: semDados.numero })} criado!` : "Painel pronto!"); home();
      } catch (e) { draw("Não consegui salvar: " + (e.message || e)); }
    }
    V.onclick = async (e) => {
      const b = e.target.closest("[data-a]"); if (!b) return; ler();
      if (b.dataset.a === "addDisc") { st.disc.push({ nome: "", professor: "", tem_pratica: false }); draw(); V.querySelectorAll('[data-k="nome"]')[st.disc.length - 1]?.focus(); }
      if (b.dataset.a === "rmDisc") { st.disc.splice(+b.dataset.i, 1); if (!st.disc.length) st.disc.push({ nome: "", professor: "", tem_pratica: false }); draw(); }
      if (b.dataset.a === "volta") { st.passo--; draw(); }
      if (b.dataset.a === "cancela") return perfilTela();
      if (b.dataset.a === "calDesc") { st.cal = {}; draw(); }
      if (b.dataset.a === "calUsar") {
        const lista = Leitor.lerRevisao(V.querySelector("#calRev"));
        lista.forEach((p) => { const d = st.disc[p.disciplina_id]; if (!d) return; if (p.modalidade === "pratica") d.tem_pratica = true;
          st.provas[kKey(p.disciplina_id, p.tipo, p.modalidade)] = { data: p.data, hora: p.hora || "07:00" }; });
        st.cal = { msg: { t: lista.length ? `${lista.length} data${lista.length === 1 ? "" : "s"} preenchida${lista.length === 1 ? "" : "s"}. Confira abaixo; nada é salvo até você concluir.` : "Nenhuma linha marcada." } }; draw();
      }
      if (b.dataset.a === "segue") { const err = valida(); if (err) return draw(err); if (st.passo < 4) { if (st.passo === 1) preencherDoCatalogo(); st.passo++; draw(); window.scrollTo(0, 0); } else salvar(); }
    };
    V.onchange = (e) => {
      if (e.target.id === "onbCal" && e.target.files?.[0]) importarCalendario(e.target.files[0]);
      const tr = e.target.closest("tr[data-rev]"); if (tr && e.target.dataset.k === "disc") tr.querySelector('[data-k="ok"]').checked = !!e.target.value;
    };
    draw();
  }

  /* ================= INÍCIO (os módulos completos chegam na Etapa 3) ================= */
  /* ================= PERFIL: nome de usuário, foto e senha ================= */
  function nomeExib() { return P.usuario || (P.nome || "").split(" ")[0] || P.email.split("@")[0]; }
  function avatarHTML(tam) {
    const ini = esc(nomeExib().slice(0, 1).toUpperCase());
    return P.avatar_url ? `<img src="${esc(P.avatar_url)}" alt="" width="${tam}" height="${tam}">` : `<span>${ini}</span>`;
  }
  function pintarEu() {
    document.getElementById("eu").hidden = false;
    document.getElementById("euAv").innerHTML = avatarHTML(28);
    document.getElementById("euNome").textContent = nomeExib();
  }
  async function reduzirFoto(file) {
    const img = await createImageBitmap(file);
    const lado = Math.min(img.width, img.height), T = 320;
    const c = document.createElement("canvas"); c.width = T; c.height = T;
    c.getContext("2d").drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, T, T);
    return await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.86));
  }
  function perfilTela(recuperando) {
    if (recuperando) sessionStorage.setItem("recuperando", "1");
    const voltar = () => { if (location.hash) history.replaceState(null, "", location.pathname); if (TERMOS.pendente || TERMOS.erro) return seguir(); if (!App.acessoOk(P) && !P.is_admin) return location.reload(); return P.onboarding_ok ? home() : onboarding(); };
    window.Painel?.fechar(); V.onclick = null; V.onchange = null;
    V.innerHTML = `<div class="hero"><h1>Meu<span class="script">perfil</span></h1></div>`
      + (recuperando ? "" : win("Foto e nome", `<div class="perfil">
          <div class="av av-g" id="avG">${avatarHTML(96)}</div>
          <div class="stack" style="flex:1;min-width:0">
            <label class="field"><span class="mono">Nome de usuário</span><input id="usuario" maxlength="30" value="${esc(P.usuario || nomeExib())}"></label>
            <div class="row"><label class="btn" style="cursor:pointer">Escolher foto<input type="file" id="foto" accept="image/jpeg,image/png,image/webp" hidden></label>
            ${P.avatar_url ? `<button class="btn ghost" id="tirarFoto">Remover foto</button>` : ""}<button class="btn solid" id="salvarPerfil">Salvar</button></div>
            <span class="muted" style="font-size:13px">${esc(P.email)}</span>
          </div></div><div id="msgPerfil"></div>`)
        + (P.onboarding_ok && (App.acessoOk(P) || P.is_admin) ? win("Meu semestre", `<div id="semBox"><p class="muted" style="margin:0">Carregando…</p></div>`) : ""))
      + (recuperando ? win("Crie sua senha nova", `<form id="fSenha" class="stack" style="max-width:380px">
          <label class="field"><span class="mono">Senha nova</span><input id="s1" type="password" minlength="8" autocomplete="new-password" required></label>
          <label class="field"><span class="mono">Repita a senha</span><input id="s2" type="password" minlength="8" autocomplete="new-password" required></label>
          <button class="btn solid">Salvar senha</button></form><div id="msgSenha"></div>`)
        : win("Trocar senha", `<div id="senhaBox"></div>`) + win("E-mail de acesso", `<div id="emailBox"><p class="muted" style="margin:0">Carregando…</p></div>`))
      + (recuperando ? "" : `<div class="row" style="margin-top:16px"><button class="btn ghost" id="voltar">Voltar ao painel</button>${P.onboarding_ok && (App.acessoOk(P) || P.is_admin) ? `<button class="btn" id="irCfg">Configurações</button>` : ""}</div>`);
    let novaFoto = null;
    const q = (id) => document.getElementById(id);
    if (q("semBox")) semestreBox();
    if (q("voltar")) q("voltar").onclick = voltar;
    if (q("irCfg")) q("irCfg").onclick = () => { if (location.hash) history.replaceState(null, "", location.pathname); home("config"); };
    if (q("foto")) q("foto").onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > 15 * 1024 * 1024) return toast("Foto muito grande.");
      try { novaFoto = await reduzirFoto(f); q("avG").innerHTML = `<img src="${URL.createObjectURL(novaFoto)}" alt="" width="96" height="96">`; }
      catch (_) { toast("Não consegui abrir essa imagem."); }
    };
    if (q("tirarFoto")) q("tirarFoto").onclick = async () => {
      const { error } = await sb.from("perfis").update({ avatar_url: null }).eq("id", P.id);
      if (error) return toast("Erro: " + error.message);
      await sb.storage.from("avatares").remove([`${P.id}/foto.jpg`]);
      P.avatar_url = null; pintarEu(); perfilTela(); toast("Foto removida");
    };
    if (q("salvarPerfil")) q("salvarPerfil").onclick = async () => {
      const b = q("salvarPerfil"), usuario = q("usuario").value.trim();
      if (usuario.length < 2) return (q("msgPerfil").innerHTML = `<div class="msg bad">O nome de usuário precisa ter pelo menos 2 letras.</div>`);
      b.disabled = true; b.textContent = "Salvando…";
      try {
        const upd = { usuario };
        if (novaFoto) {
          const caminho = `${P.id}/foto.jpg`;
          const up = await sb.storage.from("avatares").upload(caminho, novaFoto, { upsert: true, contentType: "image/jpeg", cacheControl: "60" });
          if (up.error) throw up.error;
          upd.avatar_url = sb.storage.from("avatares").getPublicUrl(caminho).data.publicUrl + "?v=" + Date.now();
        }
        const { error } = await sb.from("perfis").update(upd).eq("id", P.id); if (error) throw error;
        Object.assign(P, upd); novaFoto = null; pintarEu(); toast("Perfil salvo");
        q("msgPerfil").innerHTML = "";
      } catch (e) { q("msgPerfil").innerHTML = `<div class="msg bad">Não consegui salvar: ${esc(e.message || e)}</div>`; }
      b.disabled = false; b.textContent = "Salvar";
    };
    if (q("senhaBox")) senhaBox();
    if (q("emailBox")) emailBox();
    if (q("fSenha")) q("fSenha").onsubmit = async (e) => {
      e.preventDefault();
      const s1 = q("s1").value, s2 = q("s2").value;
      if (s1.length < 8) return (q("msgSenha").innerHTML = `<div class="msg bad">Use pelo menos 8 caracteres.</div>`);
      if (s1 !== s2) return (q("msgSenha").innerHTML = `<div class="msg bad">As duas senhas não são iguais.</div>`);
      const { error } = await sb.auth.updateUser({ password: s1 });
      if (error) return (q("msgSenha").innerHTML = `<div class="msg bad">${/same|different/i.test(error.message) ? "A senha nova precisa ser diferente da atual." : "Não consegui trocar: " + esc(error.message)}</div>`);
      sessionStorage.removeItem("recuperando"); toast("Senha salva");
      if (recuperando) return voltar();
      q("fSenha").reset(); q("msgSenha").innerHTML = `<div class="msg">Senha trocada. Use a nova no próximo login.</div>`;
    };
  }

  /* ================= SEGURANÇA: trocar a senha e o e-mail, sempre confirmando pelo e-mail ================= */
  // Senha: o Supabase manda um código de 6 números para o e-mail atual (reauthenticate) e só aceita a
  // senha nova com esse código. E-mail: com "Secure email change" ligado no Supabase, a troca só vale
  // depois de confirmar nos DOIS e-mails (o atual e o novo). Veja o README (Etapa 6).
  function erroAuth(e) {
    const m = `${e?.message || ""} ${e?.code || ""}`;
    if (e?.status === 429 || /rate limit|too many|security purposes|over_email_send_rate/i.test(m)) return "Muitas tentativas seguidas. Espere um minuto e tente de novo.";
    if (/reauthentication_needed|requires? reauthentication/i.test(m)) return "Peça o código no seu e-mail antes de trocar a senha.";
    if (/(nonce|reauthenticat|otp|token|code)/i.test(m) && /(invalid|expired|not found|incorrect)/i.test(m)) return "Código errado ou vencido. Confira os 6 números ou peça outro código.";
    if (/weak|pwned|at least|characters|should contain|too short/i.test(m)) return "Senha fraca: use pelo menos 8 caracteres, misturando letras e números.";
    if (/same.*password|different from the old/i.test(m)) return "A senha nova precisa ser diferente da atual.";
    if (/already (been )?registered|email.*exists|email_exists/i.test(m)) return "Esse e-mail já é usado por outra conta.";
    if (/invalid.*email|email.*invalid|validate email/i.test(m)) return "Esse e-mail não parece certo. Confira e tente de novo.";
    return "Não consegui agora: " + (e?.message || "tente de novo em instantes.");
  }
  function senhaBox() {
    const box = document.getElementById("senhaBox"); if (!box) return;
    const msg = SEG.msg ? `<div class="msg ${SEG.msg.bad ? "bad" : ""}" style="margin:0" aria-live="polite">${esc(SEG.msg.t)}</div>` : "";
    box.innerHTML = !SEG.codigo ? `<div class="stack" style="max-width:420px"><p style="margin:0">Para trocar a senha, mandamos um <b>código de 6 números</b> para o seu e-mail (<b>${esc(P.email)}</b>). Assim ninguém troca a sua senha só porque achou o site aberto.</p>
        <div class="row"><button class="btn solid" id="pedirCodigo">Enviar código para meu e-mail</button></div>${msg}</div>`
      : `<form id="fSenhaCod" class="stack" style="max-width:380px">
        <label class="field"><span class="mono">Código que chegou no e-mail</span><input id="cod" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="6 números" required></label>
        <label class="field"><span class="mono">Senha nova</span><input id="s1" type="password" minlength="8" autocomplete="new-password" required></label>
        <label class="field"><span class="mono">Repita a senha</span><input id="s2" type="password" minlength="8" autocomplete="new-password" required></label>
        <div class="row"><button class="btn solid">Salvar senha</button><button type="button" class="btn ghost" id="outroCodigo">Mandar outro código</button></div>${msg}
        <p class="muted" style="margin:0;font-size:13px">Não chegou? Olhe a caixa de spam. O código vale por pouco tempo.</p></form>`;
    const pedir = async (b) => {
      b.disabled = true;
      const { error } = await sb.auth.reauthenticate();
      SEG.msg = error ? { bad: true, t: erroAuth(error) } : { t: `Mandamos o código para ${P.email}. Digite abaixo com a senha nova.` };
      if (!error) SEG.codigo = true;
      senhaBox(); document.getElementById("cod")?.focus();
    };
    const q = (id) => document.getElementById(id);
    if (q("pedirCodigo")) q("pedirCodigo").onclick = (e) => pedir(e.currentTarget);
    if (q("outroCodigo")) q("outroCodigo").onclick = (e) => pedir(e.currentTarget);
    if (q("cod")) q("cod").oninput = (e) => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6); };
    if (q("fSenhaCod")) q("fSenhaCod").onsubmit = async (e) => {
      e.preventDefault();
      const cod = q("cod").value.trim(), s1 = q("s1").value, s2 = q("s2").value;
      const bad = (t) => { SEG.msg = { bad: true, t }; senhaBox(); };
      if (!/^\d{6}$/.test(cod)) return bad("O código tem 6 números.");
      if (s1.length < 8) return bad("Use pelo menos 8 caracteres.");
      if (s1 !== s2) return bad("As duas senhas não são iguais.");
      e.submitter && (e.submitter.disabled = true);
      const { error } = await sb.auth.updateUser({ password: s1, nonce: cod });
      if (error) return bad(erroAuth(error));
      SEG.codigo = false; SEG.msg = { t: "Senha trocada. Use a nova no próximo login." }; toast("Senha salva"); senhaBox();
    };
  }

  /* ================= GOOGLE DRIVE: ligar a pasta e importar os materiais ================= */
  // Duas formas: compartilhar a pasta com o e-mail de leitura do site, ou entrar com o Google.
  // O servidor (drive-varrer) lê a pasta e as subpastas, liga cada arquivo à matéria e cria os temas.
  // Resumos NÃO são gerados aqui: só quando o aluno pede.
  async function chamar(nome, body) {
    const { data, error } = await sb.functions.invoke(nome, { body });
    let erro = data?.erro, generico = false;
    if (!erro && error) { try { erro = (await error.context.json()).erro } catch (_) { } if (!erro) { erro = "O servidor não respondeu. Tente de novo."; generico = true; } }
    if (erro) { const e = new Error(erro); e.generico = generico; throw e; }
    return data;
  }

      ${ligadas.length ? `<div class="row"><button class="btn solid" data-drv="varrer" ${DRV.ocupado ? "disabled" : ""}>${DRV.ocupado ? "Lendo…" : "Varrer agora"}</button></div>` : ""}</div>` : "";

        <div class="row"><button class="btn solid" data-drv="google" ${DRV.ocupado ? "disabled" : ""}>Conectar de novo</button></div>`
      : `<p style="margin:0"><span class="chip s-ok">conectado</span> ${g.pasta_id ? "Para usar outra pasta, cole o link novo:" : "Agora cole o link da pasta das suas matérias:"}</p>${form("google", g)}`;

      .concat([{ nome: "Sem matéria", sem: true, itens: (mats || []).filter((m) => !m.disciplina_id) },

    const listaOcultos = ocultos.length ? `<details class="drv-grupo" id="drvOcultos"><summary><b>Ocultos (${ocultos.length})</b> <span class="muted">· arquivos que você apagou ou cujo tema apagou; não voltam na leitura da pasta</span></summary>
        <ul class="drv-lista">${ocultos.map((m) => `<li><span class="drv-nome" title="${esc(m.caminho || "")}">${esc(m.nome)}</span><button class="btn" data-drv="restaurar" data-id="${m.id}">Restaurar</button></li>`).join("")}</ul></details>` : "";

    box.innerHTML = `<div class="stack">${status}
      <div class="row" role="tablist" aria-label="Como ligar a pasta">

        <button class="btn ${DRV.aba === "google" ? "solid" : ""}" role="tab" aria-selected="${DRV.aba === "google"}" data-drv="aba" data-v="google">Entrar com o Google</button></div>

      <div id="drvProg">${DRV.msg ? `<div class="msg ${DRV.msg.bad ? "bad" : ""}" style="margin:0">${esc(DRV.msg.t)}</div>` : ""}</div>

  // Chama o servidor até acabar de ler tudo (cada chamada lê o que der em ~1,5 min)
  async function varrer(disc, ligar) {
    if (DRV.ocupado) return;
    DRV.ocupado = true; DRV.msg = null; await driveTela(disc);
    const prog = () => document.getElementById("drvProg");
    let corpo = ligar || {}, voltas = 0, falhas = 0, r = null;
    try {
      while (voltas < 40) {
        if (prog()) prog().innerHTML = `<div class="msg" style="margin:0" aria-live="polite">${r ? `Lendo os arquivos… ${r.arquivos - r.restantes} de ${r.arquivos} prontos.` : ligar ? "Abrindo a pasta…" : "Lendo sua pasta…"} Pode levar alguns minutos.</div>`;
        try { r = await chamar("drive-varrer", corpo); }
        catch (e) { if (!e.generico || ++falhas > 2) throw e; continue; } // queda do servidor: tenta de novo
        corpo = {}; voltas++; falhas = 0;
        if (r.feito || !r.restantes) break;
      }
      const partes = [`${r.arquivos} ${r.arquivos === 1 ? "arquivo" : "arquivos"}`];
      if (r.novos) partes.push(`${r.novos} ${r.novos === 1 ? "novo" : "novos"}`);
      if (r.atualizados) partes.push(`${r.atualizados} ${r.atualizados === 1 ? "atualizado" : "atualizados"}`);
      if (r.removidos) partes.push(`${r.removidos} ${r.removidos === 1 ? "removido" : "removidos"}`);
      const comErro = (r.fontes || []).find((f) => f.status === "erro" || f.status === "reconectar");
      DRV.msg = comErro ? { bad: true, t: comErro.erro || "Não consegui ler uma das pastas." }
        : { t: `Pronto: ${partes.join(", ")}.${r.sem_materia ? ` ${r.sem_materia} sem matéria (veja no fim da lista).` : ""}` };
      if (ligar) toast("Pasta ligada");
    } catch (e) { DRV.msg = { bad: true, t: e.message }; }
    DRV.ocupado = false;
    await driveTela(disc);
    window.Painel?.aoMudarDrive(); // temas novos vindos do Drive aparecem nas abas
  }

  /* ================= LIVROS: o aluno envia o livro dele e procura nele ================= */
  // O arquivo NÃO sai do aparelho: o navegador tira o texto, corta em trechos com o número
  // da página e grava só o texto no banco (tabelas livros e livro_trechos, 05_livros.sql).
  // A busca (buscar_nos_livros) é a base para os resumos compararem livro x slides do professor.
  // Junta as páginas em trechos de ~2.000 letras, cortando em fim de frase, sem misturar capítulos
  function fatiar(unidades, alvo = 2000, max = 2600) {
    const out = []; let cur = "", ini = null, fim = null, cap = null;
    const fecha = () => { if (cur) out.push({ pagina_ini: ini, pagina_fim: fim, capitulo: cap ? cap.slice(0, 300) : null, texto: cur }); cur = ""; ini = null; fim = null; };
    for (const u of unidades) {
      let t = limpar(u.texto); if (!t) continue;
      if (cur && u.cap !== cap && cur.length >= alvo * 0.4) fecha();
      while (t) {
        if (!cur) { ini = u.pag; cap = u.cap || null; }
        if (cur.length + t.length + 1 <= max) { cur += (cur ? " " : "") + t; fim = u.pag; t = ""; if (cur.length >= alvo) fecha(); continue; }
        if (cur.length >= alvo * 0.5) { fecha(); continue; }
        const lim = max - cur.length - 1;
        let corte = t.lastIndexOf(". ", lim); if (corte < lim * 0.5) corte = t.lastIndexOf(" ", lim); if (corte < lim * 0.3) corte = lim; else corte += 1;
        cur += (cur ? " " : "") + t.slice(0, corte).trim(); fim = u.pag; t = t.slice(corte).trim(); fecha();
      }
    }
    fecha();
    return out;
  }

  async function lerPDF(doc, prog) {
    const n = doc.numPages, caps = [];
    try { // sumário do PDF (se tiver): vira o "capítulo" de cada trecho
      const pagDe = async (dest) => { const d = typeof dest === "string" ? await doc.getDestination(dest) : dest; return d && d[0] ? (await doc.getPageIndex(d[0])) + 1 : null; };
      const ol = (await doc.getOutline()) || [];
      for (const it of ol.slice(0, 300)) {
        const p = await pagDe(it.dest).catch(() => null); if (p) caps.push({ p, t: it.title });
        for (const sub of (it.items || []).slice(0, 60)) { const q = await pagDe(sub.dest).catch(() => null); if (q) caps.push({ p: q, t: `${it.title} · ${sub.title}` }); }
      }
      caps.sort((a, b) => a.p - b.p);
    } catch (_) { }
    const capDe = (p) => { let c = null; for (const x of caps) { if (x.p <= p) c = x.t; else break; } return c; };
    const unidades = [];
    for (let i = 1; i <= n; i++) {
      const pg = await doc.getPage(i);
      const tc = await pg.getTextContent();
      unidades.push({ pag: i, cap: capDe(i), texto: tc.items.map((it) => (it.str || "") + (it.hasEOL ? "\n" : "")).join("") });
      pg.cleanup();
      if (i % 5 === 0 || i === n) prog(i / n, `Lendo a página ${i} de ${n}…`);
    }
    return { paginas: n, unidades };
  }
  function textoHTML(html) { // texto de um capítulo de EPUB (o DOMParser não roda scripts nem carrega imagens)
    const d = new DOMParser().parseFromString(html, "text/html");
    d.querySelectorAll("script,style").forEach((e) => e.remove());
    d.querySelectorAll("p,div,li,br,tr,h1,h2,h3,h4,h5,h6").forEach((e) => e.append("\n"));
    const h = d.querySelector("h1,h2,h3")?.textContent || d.querySelector("title")?.textContent || "";
    return { texto: d.body?.textContent || "", titulo: limpar(h) };
  }
  async function lerEPUB(file, prog) {
    const JSZip = await carregarJSZip(); const zip = await JSZip.loadAsync(file);
    const xml = (t) => new DOMParser().parseFromString(t, "application/xml");
    const cont = xml(await zip.file("META-INF/container.xml").async("string"));
    const opfPath = cont.querySelector("rootfile").getAttribute("full-path"), base = opfPath.includes("/") ? opfPath.replace(/[^/]+$/, "") : "";
    const opf = xml(await zip.file(opfPath).async("string"));
    const man = {}; opf.querySelectorAll("manifest > item").forEach((i) => { man[i.getAttribute("id")] = i.getAttribute("href"); });
    const spine = [...opf.querySelectorAll("spine > itemref")].map((r) => man[r.getAttribute("idref")]).filter(Boolean);
    const meta = { titulo: opf.getElementsByTagName("dc:title")[0]?.textContent || "", autor: opf.getElementsByTagName("dc:creator")[0]?.textContent || "" };
    const unidades = [];
    for (let i = 0; i < spine.length; i++) {
      const caminho = decodeURIComponent((base + spine[i]).replace(/#.*$/, ""));
      const f = zip.file(caminho); if (!f) continue;
      const { texto, titulo } = textoHTML(await f.async("string"));
      unidades.push({ pag: i + 1, cap: titulo || null, texto });
      prog((i + 1) / spine.length, `Lendo a seção ${i + 1} de ${spine.length}…`);
    }
    return { paginas: null, unidades, meta };
  }
  async function lerDOCX(file, prog) {
    const JSZip = await carregarJSZip(); const zip = await JSZip.loadAsync(file);
    const d = new DOMParser().parseFromString(await zip.file("word/document.xml").async("string"), "application/xml");
    const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
    const unidades = []; let cap = null;
    for (const p of d.getElementsByTagNameNS(W, "p")) {
      const t = [...p.getElementsByTagNameNS(W, "t")].map((x) => x.textContent).join("");
      const estilo = p.getElementsByTagNameNS(W, "pStyle")[0]?.getAttributeNS(W, "val") || "";
      if (/^(heading|t[ií]tulo)\s*[12]$/i.test(estilo.replace(/\s/g, "")) && t.trim()) cap = t.trim();
      unidades.push({ pag: null, cap, texto: t + "\n" });
    }
    prog(1, "Texto lido.");
    return { paginas: null, unidades };
  }
  async function lerTXT(file, prog) { const t = await file.text(); prog(1, "Texto lido."); return { paginas: null, unidades: t.split(/\n{2,}/).map((x) => ({ pag: null, cap: null, texto: x })) }; }

  async function livrosTela() {
    const box = document.getElementById("liv"); if (!box) return;
    const { data: livros, error } = await sb.from("livros").select("id,titulo,autor,edicao,formato,paginas,status,erro,total_trechos,criado_em").order("criado_em", { ascending: false });
    if (!document.getElementById("liv")) return;
    if (error) { box.innerHTML = /livros|relation|schema cache/i.test(error.message) ? `<p class="muted" style="margin:0">A parte de livros ainda não foi ativada no banco (falta rodar o 05_livros.sql).</p>` : `<div class="msg bad" style="margin:0">Não consegui carregar seus livros: ${esc(error.message)}</div>`; return; }
    const emFila = new Set(Fila.pendentes().filter((j) => j.tipo === "livro" && j.dados.livroId).map((j) => j.dados.livroId));
    const L = (livros || []).filter((l) => !emFila.has(l.id));
    const lista = L.length ? `<ul class="liv-lista">${L.map((l) => { const [cls, txt] = LIV_STATUS[l.status] || ["s-warn", l.status];
      const info = [l.autor, l.edicao ? `${l.edicao}` : "", FORMATOS[l.formato] || "", l.paginas ? `${l.paginas} páginas` : "", l.total_trechos ? `${l.total_trechos} trechos` : ""].filter(Boolean).map(esc).join(" · ");
      return `<li><div style="min-width:0"><b class="liv-tit">${esc(l.titulo)}</b><div class="muted" style="font-size:13px">${info}</div>
        ${l.status === "processando" ? `<div style="font-size:13px;color:var(--warn)">O envio parou no meio. Apague e envie de novo.</div>` : ""}${l.status === "erro" && l.erro ? `<div style="font-size:13px;color:var(--bad)">${esc(l.erro)}</div>` : ""}</div>
        <div class="row" style="align-items:center;flex-wrap:nowrap"><span class="chip ${cls}">${esc(txt)}</span><button class="btn ghost" data-liv="apagar" data-id="${l.id}" ${LIV.ocupado ? "disabled" : ""} aria-label="Apagar ${esc(l.titulo)}">Apagar</button></div></li>`; }).join("")}</ul>`
      : `<div class="empty">Nenhum livro ainda.</div>`;
    const form = !LIV.aberto ? `<div class="row"><button class="btn solid" data-liv="abrir" ${LIV.ocupado ? "disabled" : ""}>Adicionar livro</button></div>`
      : `<form id="livForm" class="stack liv-form">
        <label class="field"><span class="mono">Arquivo do livro (PDF, EPUB, Word ou .txt)</span><input type="file" id="livArq" accept=".pdf,.epub,.docx,.txt,.md,application/pdf,application/epub+zip" ${LIV.ocupado ? "disabled" : ""}></label>
        <label class="field"><span class="mono">Título</span><input id="livTit" maxlength="300" value="${esc(LIV.form?.titulo || "")}" placeholder="Ex.: Harrison Medicina Interna"></label>
        <div class="row"><label class="field" style="flex:2 1 180px"><span class="mono">Autor (opcional)</span><input id="livAut" maxlength="300" value="${esc(LIV.form?.autor || "")}"></label>
        <label class="field" style="flex:1 1 100px"><span class="mono">Edição (opcional)</span><input id="livEd" maxlength="60" value="${esc(LIV.form?.edicao || "")}" placeholder="Ex.: 21ª"></label></div>
        <div class="row"><button class="btn solid" ${LIV.ocupado ? "disabled" : ""}>${LIV.ocupado ? "Lendo…" : "Ler e guardar"}</button><button type="button" class="btn ghost" data-liv="fechar" ${LIV.ocupado ? "disabled" : ""}>Cancelar</button></div></form>`;
    box.innerHTML = `<div class="stack">
      <p style="margin:0">Guarde aqui os livros que você usa. Depois, nos resumos, você vai poder comparar o que o livro diz com os slides do professor.</p>
      <p class="muted" style="margin:0;font-size:13.5px">O livro fica só na sua conta: ninguém mais vê. O arquivo não é enviado; o site lê o texto aqui no seu aparelho e guarda só o texto, com o número das páginas. Livros grandes levam alguns minutos.</p>
      ${lista}<div id="livFila" aria-live="polite">${livrosFilaHTML()}</div>${form}
      <div id="livProg" aria-live="polite">${LIV.msg ? `<div class="msg ${LIV.msg.bad ? "bad" : ""}" style="margin:0">${esc(LIV.msg.t)}</div>` : ""}</div>
      ${L.some((l) => l.status === "ok") ? `<form id="livBusca" class="row" role="search"><label class="field" style="flex:1 1 220px"><span class="mono">Procurar nos meus livros</span>
        <input id="livQ" type="search" maxlength="200" value="${esc(LIV.busca)}" placeholder="Ex.: pneumonia comunitária tratamento"></label><button class="btn solid">Procurar</button></form>
      <div id="livRes">${LIV.res || ""}</div>` : ""}</div>`;

    const q = (id) => document.getElementById(id);
    if (q("livArq")) q("livArq").onchange = () => escolher(q("livArq").files[0]);
    if (q("livForm")) q("livForm").onsubmit = (e) => { e.preventDefault(); enviar(); };
    if (q("livBusca")) q("livBusca").onsubmit = (e) => { e.preventDefault(); procurar(q("livQ").value.trim()); };
    box.onclick = async (e) => {
      const b = e.target.closest("[data-liv]"); if (!b || LIV.ocupado) return;
      if (b.dataset.liv === "abrir") { LIV.aberto = true; LIV.msg = null; LIV.form = null; LIV.arq = null; await livrosTela(); q("livArq")?.focus(); }
      if (b.dataset.liv === "fechar") { LIV.aberto = false; LIV.arq = null; LIV.pdf = null; LIV.form = null; livrosTela(); }
      if (b.dataset.liv === "apagar") {
        const l = L.find((x) => x.id == b.dataset.id);
        if (!confirm(`Apagar "${l?.titulo || "este livro"}"? O texto guardado dele sai do painel.`)) return;
        b.disabled = true;
        const { data: apag, error: e0 } = await sb.from("livros").delete().eq("id", b.dataset.id).select("id");
        const error = e0 || (!(apag || []).length ? { message: "o servidor não deixou." } : null);
        LIV.msg = error ? { bad: true, t: "Não consegui apagar: " + error.message } : null; LIV.res = null;
        if (!error) toast("Livro apagado"); livrosTela();
      }
    };
  }
  function formLivro() { const v = (id) => document.getElementById(id)?.value.trim() || ""; return { titulo: v("livTit"), autor: v("livAut"), edicao: v("livEd") }; }
  async function escolher(file) {
    LIV.arq = null; LIV.pdf = null; LIV.msg = null; if (!file) return;
    const prog = document.getElementById("livProg");
    const formato = formatoDe(file);
    if (!formato) { prog.innerHTML = `<div class="msg bad" style="margin:0">Esse tipo de arquivo não dá. Use PDF, EPUB, Word (.docx) ou .txt.</div>`; return; }
    if (file.size > 400 * 1024 * 1024) { prog.innerHTML = `<div class="msg bad" style="margin:0">Arquivo grande demais (mais de 400 MB).</div>`; return; }
    LIV.arq = { file, formato };
    const tit = document.getElementById("livTit"), aut = document.getElementById("livAut");
    if (!tit.value) tit.value = tituloDoArquivo(file.name);
    prog.innerHTML = "";
    if (formato === "pdf") { // título e autor de dentro do PDF, se tiver
      try {
        const lib = await carregarPdfjs();
        const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false, disableFontFace: true }).promise;
        if (LIV.arq?.file !== file) return doc.destroy();
        LIV.pdf = doc;
        const info = (await doc.getMetadata().catch(() => null))?.info || {};
        const t = limpar(info.Title), a = limpar(info.Author);
        if (t && t.length > 3 && !/^(untitled|microsoft|documento?\d*)/i.test(t) && tit.value === tituloDoArquivo(file.name)) tit.value = t.slice(0, 300);
        if (a && !aut.value) aut.value = a.slice(0, 300);
        prog.innerHTML = `<p class="muted" style="margin:0;font-size:13.5px">${doc.numPages} páginas. Confira o título e clique em "Ler e guardar".</p>`;
      } catch (e) { prog.innerHTML = `<div class="msg bad" style="margin:0">${esc(/password/i.test(e?.name + e?.message) ? "Esse PDF tem senha. Tire a senha e tente de novo." : "Não consegui abrir esse PDF. " + (e?.message || ""))}</div>`; LIV.arq = null; }
    }
  }
  // O livro entra na fila do navegador (assets/fila.js): é lido sem travar o site, e se o aluno
  // fechar a página, continua quando ele abrir o site de novo neste aparelho.
  async function enviar() {
    const prog = document.getElementById("livProg"), f = formLivro();
    if (!LIV.arq) return (prog.innerHTML = `<div class="msg bad" style="margin:0">Escolha o arquivo do livro.</div>`);
    if (!f.titulo) f.titulo = tituloDoArquivo(LIV.arq.file.name) || "Livro";
    const { file, formato } = LIV.arq;
    try { LIV.pdf?.destroy(); } catch (_) { }
    LIV.pdf = null; LIV.arq = null; LIV.aberto = false; LIV.form = null;
    await Fila.adicionar("livro", `Livro: ${f.titulo}`, { ...f, formato, nome: file.name.slice(0, 300) }, file);
    LIV.msg = { t: `"${f.titulo}" está na fila. Pode usar o resto do site enquanto ele é lido; acompanhe aqui ou em Tarefas.` };
    toast("Livro na fila");
    livrosTela();
  }
  /** Trabalho da fila: lê o livro e grava só o texto, em trechos com a página. */
  async function trabalhoLivro(job, prog) {
    const d = job.dados, file = job.arquivo;
    if (!file) throw new Error("O arquivo não ficou guardado neste aparelho. Escolha o livro de novo.");
    if (d.livroId) { await sb.from("livros").delete().eq("id", d.livroId); d.livroId = null; } // recomeço: tira o que ficou pela metade
    let r, doc = null;
    try {
      prog(0, "Abrindo o arquivo…");
      if (d.formato === "pdf") {
        const lib = await carregarPdfjs();
        try { doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false, disableFontFace: true }).promise; }
        catch (e) { throw new Error(/password/i.test(e?.name + e?.message) ? "Esse PDF tem senha. Tire a senha e tente de novo." : "Não consegui abrir esse PDF."); }
        r = await lerPDF(doc, (x, t) => prog(x * 0.7, t));
      } else if (d.formato === "epub") r = await lerEPUB(file, (x, t) => prog(x * 0.7, t));
      else if (d.formato === "docx") r = await lerDOCX(file, (x, t) => prog(x * 0.7, t));
      else r = await lerTXT(file, (x, t) => prog(x * 0.7, t));
    } finally { try { doc?.destroy(); } catch (_) { } }
    const trechos = fatiar(r.unidades);
    const letras = trechos.reduce((s, t) => s + t.texto.length, 0);
    if (!trechos.length || (r.paginas && letras < r.paginas * 40)) {
      throw Object.assign(new Error(d.formato === "pdf" ? "Esse PDF parece escaneado (as páginas são fotos, sem texto). O site ainda não lê texto de imagens. Se tiver uma versão com texto (dá para selecionar as palavras), use ela." : "Não achei texto nesse arquivo."), { st: "sem_texto" });
    }
    prog(0.7, "Guardando…");
    const ins = await sb.from("livros").insert({ titulo: d.titulo, autor: d.autor || null, edicao: d.edicao || null, formato: d.formato, paginas: r.paginas, arquivo_nome: d.nome, status: "processando" }).select("id").single();
    if (ins.error) throw ins.error;
    d.livroId = ins.data.id; await Fila.salvar(job);
    try {
      const LOTE = 100;
      for (let i = 0; i < trechos.length; i += LOTE) {
        const lote = trechos.slice(i, i + LOTE).map((t) => ({ ...t, livro_id: d.livroId }));
        let e = (await sb.from("livro_trechos").insert(lote)).error;
        if (e && !/limite/i.test(e.message)) e = (await sb.from("livro_trechos").insert(lote)).error; // uma nova tentativa se a internet falhar
        if (e) throw e;
        prog(0.7 + 0.3 * Math.min(1, (i + LOTE) / trechos.length), `Guardando os trechos… ${Math.min(i + LOTE, trechos.length)} de ${trechos.length}`);
      }
      const fim = await sb.from("livros").update({ status: "ok", total_trechos: trechos.length }).eq("id", d.livroId);
      if (fim.error) throw fim.error;
    } catch (e) {
      const m = e?.message || String(e);
      await sb.from("livros").update({ status: "erro", erro: m.slice(0, 300) }).eq("id", d.livroId);
      throw new Error(/limite/i.test(m) ? m : "Não consegui guardar o livro: " + m);
    }
    LIV.msg = { t: `Pronto: "${d.titulo}" guardado${r.paginas ? ` (${r.paginas} páginas)` : ""}. Já dá para procurar nele.` };
    if (document.getElementById("liv")) livrosTela();
    return `Guardado${r.paginas ? ` (${r.paginas} páginas)` : ""}.`;
  }
  function livrosFilaHTML() {
    const js = Fila.lista().filter((j) => j.tipo === "livro" && (j.st === "fila" || j.st === "rodando" || j.st === "erro" || j.st === "sem_texto"));
    if (!js.length) return "";
    return `<ul class="liv-lista">${js.map((j) => `<li><div style="min-width:0;flex:1"><b class="liv-tit">${esc(j.dados.titulo)}</b><div class="muted" style="font-size:13px">${esc(j.msg || "Na fila.")}</div>
      ${j.st === "rodando" && j.frac != null ? `<progress max="100" value="${Math.round(j.frac * 100)}" style="width:100%"></progress>` : ""}
      ${j.st === "fila" || j.st === "rodando" ? `<div class="muted" style="font-size:12.5px">${j.persistente ? "Continua quando você abrir o site de novo neste aparelho." : "Deixe o site aberto até terminar."}</div>` : ""}</div>
      <span class="chip ${j.st === "erro" ? "s-bad" : j.st === "sem_texto" ? "s-warn" : j.st === "rodando" ? "s-warn" : ""}">${{ fila: "na fila", rodando: "lendo", erro: "erro", sem_texto: "sem texto" }[j.st]}</span></li>`).join("")}</ul>`;
  }
  async function procurar(consulta) {
    const res = document.getElementById("livRes"); LIV.busca = consulta;
    if (!consulta) { LIV.res = null; res.innerHTML = ""; return; }
    res.innerHTML = `<p class="muted" style="margin:0">Procurando…</p>`;
    const { data, error } = await sb.rpc("buscar_nos_livros", { consulta, limite: 10 });
    if (error) LIV.res = `<div class="msg bad" style="margin:0">Não consegui procurar: ${esc(error.message)}</div>`;
    else if (!(data || []).length) LIV.res = `<div class="empty">Nada encontrado para "${esc(consulta)}". Tente outras palavras.</div>`;
    else LIV.res = `<ul class="liv-res">${data.map((x) => `<li><div class="liv-onde"><b>${esc(x.titulo)}</b>${onde(x, x.formato) ? ` · <span class="tnum">${esc(onde(x, x.formato))}</span>` : ""}${x.capitulo ? ` <span class="muted">· ${esc(x.capitulo)}</span>` : ""}</div>
      <p class="liv-trecho">${esc(x.snippet).replace(/⟦/g, "<mark>").replace(/⟧/g, "</mark>")}</p></li>`).join("")}</ul>`;
    if (document.getElementById("livRes")) document.getElementById("livRes").innerHTML = LIV.res;
  }
})();
</script>
