<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel de Estudos · Entrar</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Mono:wght@400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="wrap narrow">
  <div class="hero"><h1>Painel de<span class="script">estudos</span></h1></div>
  <section class="win"><div class="win-bar"><span class="dots"><i></i><i></i><i></i></span>Entrar</div><div class="win-body">
    <form id="f" class="stack">
      <label class="field"><span class="mono">E-mail</span><input id="email" type="email" autocomplete="email" required placeholder="voce@email.com"></label>
      <label class="field" id="campoSenha"><span class="mono">Senha</span><input id="senha" type="password" autocomplete="current-password" placeholder="A senha que você recebeu"></label>
      <button class="btn solid" id="go">Entrar</button>
      <div class="row" style="justify-content:space-between;align-items:center"><button type="button" class="btn ghost" id="modo" style="padding-left:0">Entrar com link no e-mail</button><button type="button" class="btn ghost" id="esqueci" style="padding-right:0">Esqueci a senha</button></div>
    </form>
    <div id="out"></div>
  </div></section>
  <p class="muted" style="text-align:center;font-size:13px;margin-top:18px">Ainda não tem acesso? Fale com o administrador da sua turma.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/comum.js"></script>
<script src="/assets/rodape.js"></script>
<script>
(async () => {
  const { sb, esc } = App;
  // Se já está logado, vai direto para o painel
  if (await App.sessao()) { location.replace("/app.html"); return; }
  const out = document.getElementById("out"), go = document.getElementById("go"), $ = (id) => document.getElementById(id);
  let porLink = false;
  const aviso = (t, ruim) => { out.innerHTML = `<div class="msg ${ruim ? "bad" : ""}">${t}</div>`; };
  const erroAmigavel = (m) => /invalid login|credentials/i.test(m) ? "E-mail ou senha incorretos." : /rate|seconds|limit/i.test(m) ? "Muitas tentativas seguidas. Espere um minuto e tente de novo." : /signups not allowed|not found/i.test(m) ? "Não achamos uma conta com esse e-mail. Fale com o administrador." : /not confirmed/i.test(m) ? "Sua conta ainda não foi confirmada. Fale com o administrador." : "Não consegui agora: " + esc(m);
  $("modo").onclick = () => { porLink = !porLink; $("campoSenha").hidden = porLink; $("esqueci").hidden = porLink; go.textContent = porLink ? "Receber link de acesso" : "Entrar"; $("modo").textContent = porLink ? "Entrar com senha" : "Entrar com link no e-mail"; out.innerHTML = ""; };
  $("esqueci").onclick = async () => {
    const email = $("email").value.trim().toLowerCase(); if (!email) { $("email").focus(); return aviso("Digite seu e-mail primeiro.", true); }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + "/app.html" });
    if (error) return aviso(erroAmigavel(error.message), true);
    aviso(`Se existir uma conta com <b>${esc(email)}</b>, enviamos um link para criar uma senha nova.`);
  };
  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("email").value.trim().toLowerCase();
    go.disabled = true; out.innerHTML = "";
    if (porLink) {
      go.textContent = "Enviando…";
      const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + "/app.html" } });
      go.disabled = false; go.textContent = "Receber link de acesso";
      if (error) return aviso(erroAmigavel(error.message), true);
      return aviso(`Pronto! Abra o e-mail que enviamos para <b>${esc(email)}</b> e toque no link.`);
    }
    const senha = $("senha").value; if (!senha) { go.disabled = false; $("senha").focus(); return aviso("Digite a senha.", true); }
    go.textContent = "Entrando…";
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    go.disabled = false; go.textContent = "Entrar";
    if (error) return aviso(erroAmigavel(error.message), true);
    location.replace("/app.html");
  });
})();
</script>
</body>
</html>
